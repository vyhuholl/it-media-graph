# At the repository root, not in deploy/: Ansible reads ansible.cfg from
# the working directory only, and every ansible command here is run from
# the root. Relative paths below resolve against this file.
[defaults]
inventory = deploy/inventory.ini
host_key_checking = True
# The readable YAML output that `community.general.yaml` used to give.
# That plugin was removed in community.general 12.0.0; ansible-core has
# done the same job since 2.13 through the built-in default callback.
# The ini key is `callback_result_format`, not `result_format` — the
# removal notice names the plugin option, which is spelled differently.
stdout_callback = default
callback_result_format = yaml
# Secrets reach the host only through templates marked no_log; this
# keeps them out of the local artefacts too.
no_target_syslog = True
# Git-ignored; the password itself lives in the password manager. Every
# ansible command fails while the file is missing — `make ansible-lint`
# included, which is why it is handed a throwaway one instead.
#
# Keep it 0600 and never executable: Ansible does not read an
# executable password file, it runs it as a script.
#
# A side effect worth knowing: `ansible-vault rekey` takes the *old*
# password from this file and, given no new one, re-encrypts with the
# same password and reports success. Rotate with `--new-vault-id @prompt`.
vault_password_file = deploy/.vault_pass

[ssh_connection]
pipelining = True
