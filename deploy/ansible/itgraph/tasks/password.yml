---
# Brings database roles' passwords in line with the inputs, one role per include.
# Local connections are trusted, so this needs no old password; the new one reaches
# psql on stdin, never an argument. A role's hash is written on the Secret only once
# its password is set, so a run that dies between the two tries again.
#
# An empty password, which only the reader's may be, is a role that cannot log in:
# its login is taken away whenever the mark or the database says it still has one,
# a login given by hand included. A role marked `end_sessions` has its open sessions
# ended whenever its login changes, after the change, so that one reconnecting at
# once meets the new state.

- name: "Read which password is set - {{ __itgraph_role.key }}"
  ansible.builtin.command:
    argv: "{{ __itgraph_in_namespace + ['get', 'secret', 'itgraph-postgres', '-o', 'json', '--ignore-not-found'] }}"
  register: __itgraph_marks
  changed_when: false
  no_log: true

- name: "Keep the mark - {{ __itgraph_role.key }}"
  ansible.builtin.set_fact:
    __itgraph_mark: >-
      {{ ((__itgraph_marks.stdout | default('{}', true) | from_json).metadata.annotations | default({})).get('itgraph/password-' ~ __itgraph_role.key, '') }}
  no_log: true

- name: "Read whether the role can log in - {{ __itgraph_role.key }}"
  ansible.builtin.command:
    argv: "{{ __itgraph_psql_query + [\"SELECT rolcanlogin FROM pg_roles WHERE rolname = '\" ~ __itgraph_role.role ~ \"'\"] }}"
  register: __itgraph_login
  changed_when: false
  when: __itgraph_role.password | length == 0

- name: "Change the password - {{ __itgraph_role.key }}"
  ansible.builtin.command:
    argv: "{{ __itgraph_psql + ['-f', '-'] }}"
    stdin: "ALTER ROLE {{ __itgraph_role.role }} LOGIN PASSWORD '{{ __itgraph_role.password }}';{{ __itgraph_end_sessions }}"
  when: __itgraph_role.password | length > 0 and __itgraph_mark != (__itgraph_role.password | hash('sha256'))
  changed_when: true
  no_log: true

- name: "Take the login away - {{ __itgraph_role.key }}"
  ansible.builtin.command:
    argv: "{{ __itgraph_psql + ['-f', '-'] }}"
    stdin: "ALTER ROLE {{ __itgraph_role.role }} NOLOGIN PASSWORD NULL;{{ __itgraph_end_sessions }}"
  when: >-
    __itgraph_role.password | length == 0
    and (__itgraph_mark | length > 0 or __itgraph_login.stdout | default('') | trim == 't')
  changed_when: true

- name: "Mark the password as set - {{ __itgraph_role.key }}"
  ansible.builtin.command:
    argv: >-
      {{ __itgraph_in_namespace + ['annotate', 'secret', 'itgraph-postgres', '--overwrite',
         'itgraph/password-' ~ __itgraph_role.key ~ '=' ~ (__itgraph_role.password | hash('sha256'))] }}
  when: __itgraph_role.password | length > 0
  changed_when: false
  no_log: true

- name: "Remove the mark - {{ __itgraph_role.key }}"
  ansible.builtin.command:
    argv: "{{ __itgraph_in_namespace + ['annotate', 'secret', 'itgraph-postgres', 'itgraph/password-' ~ __itgraph_role.key ~ '-'] }}"
  when: __itgraph_role.password | length == 0 and __itgraph_mark | length > 0
  changed_when: false
