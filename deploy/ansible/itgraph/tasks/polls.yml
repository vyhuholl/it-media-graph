---
# Whether the collector is really collecting: a poll newer than its start, which only
# working MTProto through the exit can produce. Inside quiet hours it polls nothing, so
# this cannot be known, and the report says so rather than passing it. The same holds
# when quiet hours would begin before the wait for a poll is through.

- name: Work out whether the collector polls for as long as this waits
  ansible.builtin.include_tasks: quiet.yml
  vars:
    __itgraph_quiet_wait: >-
      {{ (__itgraph_polls_retries | default(30) | int) * (__itgraph_polls_delay | default(10) | int) }}

- name: Say why polls cannot be checked, if they cannot
  ansible.builtin.set_fact:
    __itgraph_polls_quiet: >-
      {{ ('quiet hours until ' ~ itgraph_quiet_to_hour ~ ':00 ' ~ itgraph_timezone)
         if __itgraph_quiet_now | bool
         else ('quiet hours from ' ~ itgraph_quiet_from_hour ~ ':00 ' ~ itgraph_timezone
               ~ ', before the wait for a poll would end')
         if __itgraph_quiet_soon | bool
         else '' }}

- name: Note that polls could not be checked
  ansible.builtin.set_fact:
    __itgraph_polls_report: "could not be checked: {{ __itgraph_polls_quiet }}"
  when: __itgraph_polls_quiet | length > 0

- name: See polls advance
  when: __itgraph_polls_quiet | length == 0
  block:
    - name: Read when the collector started
      ansible.builtin.command:
        argv: >-
          {{ __itgraph_in_namespace + ['get', 'pods', '-l', 'app=itgraph-watch',
             '-o', 'jsonpath={.items[0].status.containerStatuses[0].state.running.startedAt}'] }}
      register: __itgraph_watch_started
      changed_when: false

    - name: Wait for a poll newer than its start
      ansible.builtin.command:
        argv: >-
          {{ __itgraph_psql_query + ["SELECT count(*) FROM tg_poll_state WHERE last_polled_at > '"
             ~ __itgraph_watch_started.stdout | trim ~ "'::timestamptz"] }}
      register: __itgraph_polls_newer
      until: __itgraph_polls_newer.stdout | trim | int > 0
      retries: "{{ __itgraph_polls_retries | default(30) }}"
      delay: "{{ __itgraph_polls_delay | default(10) }}"
      changed_when: false
      failed_when: false

    - name: Assert polls advance
      ansible.builtin.assert:
        that: __itgraph_polls_newer.stdout | trim | int > 0
        fail_msg: >-
          The collector has concluded no poll since it started, five minutes ago, outside quiet hours. Its log:
          `kubectl -n {{ itgraph_namespace }} logs deployment/itgraph-watch`.
        quiet: true

    - name: Note that polls advance
      ansible.builtin.set_fact:
        __itgraph_polls_report: advancing
