---
# Non-secret settings. Secrets live beside this file in
# secrets.vault.yml, encrypted.
#
# Both are in `group_vars/all/` — a **directory**, not two files named
# `all.yml` and `secrets.vault.yml`. `group_vars/<name>.yml` names an
# inventory *group*, so a file called `secrets.vault.yml` is variables
# for a group named `secrets.vault`; no such group exists, so it is
# silently never read and every secret in it goes missing. Inside a
# `group_vars/all/` directory the filenames mean nothing and everything
# is loaded for the `all` group, which is what was wanted.

itgraph_repo_url: https://github.com/vyhuholl/it-media-graph.git
itgraph_repo_version: master

# Files only the operator has. Paths on the machine running Ansible.
#
# The session file is copied and never re-created: `itgraph login` on a
# new host makes a session with an empty entity cache, and every seed
# channel is then skipped for want of a cached peer — days of stopped
# collection from a step that looks like ordinary setup.
itgraph_session_src: ~/Documents/it-media-graph/itgraph.session
itgraph_dump_src: ~/itgraph-backups/weekly/full-LATEST.dump

db_user: itgraph
db_name: itgraph
db_port: 5433

telegram_session: itgraph.session
watch_timezone: Europe/Moscow

# The proxy endpoint lives in secrets.vault.yml, not here. It is not
# merely a credential: it is the address the collector's traffic is
# known to come from, which is what the proxy exists to keep private —
# and this file is committed in the clear. Host, port, username and
# password travel together so that configuring the proxy is one edit in
# one encrypted file, rather than a split that invites the host into the
# wrong half. Leave them empty there for a direct connection.

# A laptop suspends when the lid closes, and a suspended collector loses
# the snapshots it misses for good — history can be re-fetched, a reading
# of a post's counters at age thirty minutes cannot. Set true and the
# playbook masks the sleep targets and tells logind to ignore the lid.
host_is_laptop: true

swap_size: 2G
alerts_interval: 15min
score_interval: 15min
# Weekly. A channel that has grown is scored against the channel it used
# to be, so letting this slip is what produces repeat false alarms — see
# the virality section of src/itgraph/README.md.
baselines_schedule: "Mon *-*-* 04:30:00"

# The z a post's best metric must pass to raise an alert. Measured: 3.3
# gives about six alerts a day. Here rather than only in the code so it
# can be moved after `itgraph score --replay --threshold N` says what the
# move would have cost — which is how this number was arrived at.
alert_spike_z: 3.3
backup_interval: 4h
