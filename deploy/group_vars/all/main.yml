---
# Non-secret settings. Secrets live beside this file in
# secrets.vault.yml, encrypted.
#
# Both are in `group_vars/all/` — a **directory**, not two files named
# `all.yml` and `secrets.vault.yml`. `group_vars/<name>.yml` names an
# inventory *group*, so a file called `secrets.vault.yml` is variables
# for a group named `secrets.vault`; no such group exists, so it is
# silently never read and every secret in it goes missing. Inside a
# `group_vars/all/` directory the filenames mean nothing and everything
# is loaded for the `all` group, which is what was wanted.

# The image CI pushes, by tag; the playbook resolves the tag to a
# digest and deploys the digest.
itgraph_image_repository: ghcr.io/vyhuholl/it-media-graph

# Files only the operator has. Paths on the machine running Ansible.
#
# Both are cutover inputs: the operator copies them from the previous
# host into a 0700 directory and points these at them, and deletes the
# copies once the cutover is verified. The session is copied and never
# re-created — `itgraph login` on a new host makes a session with an
# empty entity cache, and every seed channel is then skipped for want
# of a cached peer.
itgraph_session_src: ~/itgraph-cutover/itgraph.session
itgraph_dump_src: ~/itgraph-cutover/full-LATEST.dump

db_user: itgraph
db_name: itgraph

watch_timezone: Europe/Moscow

# The public half of the off-site encryption: safe to commit. The
# identity that decrypts lives only in the operator's password manager.
# Empty means no off-site pass — but on the collection host all four
# off-site secrets (b2_key_id, b2_application_key, b2_bucket_name,
# backup_age_recipient) are set; anything in between is refused by the
# settings loader.
backup_age_recipient: "age1xz2vthm0t8527lcgngsm0n76m3tscp07eqk903yd9qtjgtp6v36q50k594"

# The schedules, in Europe/Moscow. Minutes staggered as the boot
# offsets once staggered the timers; tests hold them to the change's
# design, so a hand edit here fails `make validate` until the design
# table in tests/test_deploy_manifests.py is changed with it.
itgraph_alerts_schedule: "2-59/15 * * * *"
itgraph_score_schedule: "8-59/15 * * * *"
itgraph_yt_watch_schedule: "*/15 * * * *"
itgraph_backup_schedule: "40 */4 * * *"
itgraph_baselines_schedule: "30 4 * * *"
itgraph_yt_refresh_schedule: "0 5 * * *"

# The z a post's best metric must pass to raise an alert. Measured: 3.7
# gives about eight a day after folding, the volume 3.3 gave before
# channels were measured against their own newest posts. Here rather
# than only in the code so it can be moved after `itgraph score --replay
# --threshold N` says what the move would have cost — which is how this
# number was arrived at.
alert_spike_z: 3.7
