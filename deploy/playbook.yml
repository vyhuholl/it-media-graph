---
# Bring up collection on the k3s host, or bring a host that is already
# collecting up to date: the full run is the command for both.
#
# Everything runs through `k3s kubectl` over SSH as root. Nothing is
# installed on the host and nothing outside the `itgraph` namespace is
# created or changed.
#
# What this playbook will not do, deliberately:
#
#   * run `itgraph login`. The session file is copied from the
#     operator's machine — and only into a volume that has none —
#     because it carries the entity cache `cached_peer` reads and a
#     fresh session has none: every seed channel would be skipped for
#     want of a cached peer, recoverable only through `resolve` at a
#     couple of hundred usernames a day.
#   * restore over a database that already has channels. A re-run on a
#     coherent one skips the restore and carries on; on a broken one it
#     stops before migrating or starting anything (see the `data`
#     tasks). A re-run must not be a way to lose the inventory.
#   * stop the collector on the previous host by itself. It *checks*,
#     over SSH, that nothing there is running or enabled, and stops
#     before the copy otherwise — but stopping that host is the
#     operator's decision, and retiring it has its own playbook.
#
# Usage, from the repository root (ansible.cfg lives there):
#   ansible-playbook deploy/playbook.yml                 # everything
#   ansible-playbook deploy/playbook.yml --tags prepare  # a host, not collecting yet
#   ansible-playbook deploy/playbook.yml --tags migrate
#   ansible-playbook deploy/playbook.yml --tags services
#   ansible-playbook deploy/playbook.yml --tags verify

- name: Deploy itgraph collection
  hosts: collector
  become: false
  # Nothing here reads a fact: `ansible_user` comes from the inventory.
  # Gathering would be a round trip per run, on every tag, for nothing.
  gather_facts: false

  vars:
    # One prefix for every kubectl call; every object lives here.
    kubectl: k3s kubectl -n itgraph
    # Root-only, on the host. The dump and the session travel through
    # files in it — not through Ansible's `stdin`, which carries text
    # and would corrupt either.
    transfer_dir: /root/.itgraph-transfer
    # The session's name inside its volume; itgraph-env's
    # TELEGRAM_SESSION points at the same path.
    session_volume_path: /session/itgraph.session
    postgres_pod: itgraph-postgres-0

  pre_tasks:

    - name: Refuse to run without the things only the operator has
      ansible.builtin.assert:
        that:
          - itgraph_session_src is defined
          - itgraph_dump_src is defined
          - itgraph_storage_class is defined
          - telegram_api_hash is defined
          - bot_db_password is defined
          - proxy_socks_password is defined
          - proxy_outbound is defined
          - proxy_outbound | length > 0
          - (b2_key_id | default("") | length == 0) == (b2_application_key | default("") | length == 0)
          - (b2_key_id | default("") | length == 0) == (b2_bucket_name | default("") | length == 0)
          - (b2_key_id | default("") | length == 0) == (backup_age_recipient | default("") | length == 0)
        fail_msg: >-
          Set itgraph_session_src and itgraph_dump_src in
          deploy/group_vars/all/main.yml, the secrets in
          deploy/group_vars/all/secrets.vault.yml and
          itgraph_storage_class on the [collector] host in the
          inventory — note the `all/` directory, a file named
          group_vars/secrets.vault.yml is read as variables for a group
          called `secrets.vault` and silently ignored. The B2 settings
          are all four or none, as the application's settings loader
          also demands. Nothing here can be invented for you.
        quiet: true
      tags: [always]

    # The exit check puts it in a proxy URL, and a `@`, `:` or `/` there
    # breaks the URL rather than the password — a check that fails for
    # a reason it cannot name. A generator's letters and digits lose
    # nothing at twenty characters and more.
    - name: The SOCKS password is random and URL-safe
      ansible.builtin.assert:
        that: proxy_socks_password is match('^[A-Za-z0-9]{20,}$')
        fail_msg: >-
          proxy_socks_password in the vault must be 20 or more letters
          and digits, from a generator — nothing else, so that it fits a
          proxy URL unescaped.
        quiet: true
      tags: [always]

    # ------------------------------------------------- the image (always)

    # The controller's checkout knows the URL; the registry answers
    # what the tip of master is without a local clone of anything. Not
    # the git module: it would clone, and the question is one line.
    - name: Which commit is being deployed
      ansible.builtin.command: git ls-remote origin refs/heads/master  # noqa: command-instead-of-module
      args:
        chdir: "{{ playbook_dir }}/.."
      register: remote_tip
      changed_when: false
      delegate_to: localhost
      when: itgraph_commit is not defined
      tags: [always]

    - name: The commit, from the flag or the tip of master
      ansible.builtin.set_fact:
        itgraph_commit: "{{ remote_tip.stdout.split()[0] }}"
      when: itgraph_commit is not defined
      tags: [always]

    # CI builds on every push; a deploy run right behind a push races
    # it. Bounded: twenty minutes, then the deploy fails — before
    # anything in the namespace is touched, because nothing below here
    # has run yet. Anonymous: the package is public.
    #
    # `|| exit 0` on both curls, so a network error or a missing tag is
    # a retry, not a hard failure with its own shape.
    - name: Wait for the image CI is building
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          token=$(curl -fsS
          "https://ghcr.io/token?scope=repository:{{ itgraph_image_repository | replace('ghcr.io/', '') }}:pull"
          | sed -n 's/.*"token": *"\([^"]*\)".*/\1/p') || exit 0;
          test -n "$token" || exit 0;
          curl -fsSI -H "Authorization: Bearer $token"
          -H "Accept: application/vnd.oci.image.index.v1+json,
          application/vnd.docker.distribution.manifest.list.v2+json,
          application/vnd.oci.image.manifest.v1+json,
          application/vnd.docker.distribution.manifest.v2+json"
          "https://ghcr.io/v2/{{ itgraph_image_repository | replace('ghcr.io/', '') }}/manifests/{{ itgraph_commit }}"
          | tr -d '\r'
          | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: *//p' || exit 0
        executable: /bin/bash
      register: image_poll
      until: image_poll.stdout | length > 0
      retries: 40
      delay: 30
      changed_when: false
      failed_when: false
      delegate_to: localhost
      tags: [always]

    - name: The image exists
      ansible.builtin.assert:
        that: image_poll.stdout is match("^sha256:[0-9a-f]{64}$")
        fail_msg: >-
          ghcr has no image for {{ itgraph_commit }} after twenty
          minutes: CI has not finished, or failed, or the commit is not
          pushed. Stopping before anything in the namespace is changed
          — a deploy without its image has nothing to deploy.
        quiet: true
      tags: [always]

    # The tag is a pointer; what runs is the digest it named at this
    # moment. A tag moved later changes nothing here.
    - name: The image, by digest
      ansible.builtin.set_fact:
        itgraph_image: "{{ itgraph_image_repository }}@{{ image_poll.stdout }}"
      tags: [always]

    - name: What is being deployed
      ansible.builtin.debug:
        msg: "{{ itgraph_commit }} · {{ itgraph_image }}"
      tags: [always]

    # The checksum of the rendered configuration, as one value: the
    # pod templates carry it, so a changed configuration changes the
    # template, and the Deployment controller restarts what reads it.
    # Computed from the same template the `config` tasks apply, so the
    # two cannot disagree.
    - name: The configuration's checksum
      ansible.builtin.set_fact:
        itgraph_env_checksum: >-
          {{ lookup('ansible.builtin.template', 'k8s/secret-env.yml.j2') | checksum }}
      no_log: true
      tags: [always]

  tasks:

    # ---------------------------------------------------------- prepare

    - name: The host's k3s kubectl answers
      ansible.builtin.command: k3s kubectl get namespace default
      register: kubectl_answers
      changed_when: false
      tags: [prepare]

    # `always`, like its removal at the end: every part renders into it
    # — the console under `migrate`, the services under `services`, the
    # secrets under `config` — and the last task of every run, whatever
    # was selected, takes it away again.
    - name: The transfer directory
      ansible.builtin.file:
        path: "{{ transfer_dir }}"
        state: directory
        mode: "0700"
      tags: [always]

    - name: Render the namespace's objects
      ansible.builtin.template:
        src: "k8s/{{ item }}.yml.j2"
        dest: "{{ transfer_dir }}/{{ item }}.yml"
        mode: "0600"
      loop:
        - namespace
        - netpol
        - storage
      tags: [prepare]

    - name: Apply the namespace's objects
      ansible.builtin.command: >-
        {{ kubectl }} apply --server-side --field-manager=itgraph
        -f {{ transfer_dir }}/{{ item }}.yml
      register: prepare_applied
      changed_when: "'configured' in prepare_applied.stdout or 'created' in prepare_applied.stdout"
      loop:
        - namespace
        - netpol
        - storage
      tags: [prepare]

    - name: Remove the rendered objects from the host
      ansible.builtin.file:
        path: "{{ transfer_dir }}/{{ item }}.yml"
        state: absent
      loop:
        - namespace
        - netpol
        - storage
      tags: [prepare]

    # ------------------------------------------------------------ config

    # A block with `always`, so the rendered Secrets leave the host even
    # when the apply fails: they are the bot token, the api hash and the
    # VPN credentials in plain text.
    - name: The secrets and the proxy
      tags: [prepare, config]
      block:
        # no_log here and not on the apply: a template failure shows the
        # line it failed on, and these lines are the secrets; kubectl
        # apply prints object names, never content.
        - name: Render the secrets and the proxy
          ansible.builtin.template:
            src: "k8s/{{ item }}.yml.j2"
            dest: "{{ transfer_dir }}/{{ item }}.yml"
            mode: "0600"
          no_log: true
          loop:
            - secret-env
            - secret-postgres
            - secret-proxy
            - proxy

        - name: Apply the secrets and the proxy
          ansible.builtin.command: >-
            {{ kubectl }} apply --server-side --field-manager=itgraph
            -f {{ transfer_dir }}/{{ item }}.yml
          register: config_applied
          changed_when: "'configured' in config_applied.stdout or 'created' in config_applied.stdout"
          loop:
            - secret-env
            - secret-postgres
            - secret-proxy
            - proxy

      always:
        - name: Remove the rendered secrets from the host
          ansible.builtin.file:
            path: "{{ transfer_dir }}/{{ item }}.yml"
            state: absent
          loop:
            - secret-env
            - secret-postgres
            - secret-proxy
            - proxy

    - name: The proxy is up
      ansible.builtin.command: >-
        {{ kubectl }} rollout status deploy/itgraph-proxy --timeout=180s
      changed_when: false
      tags: [prepare, config]

    # The console is applied under every tag that changes something
    # through it — the migration, the session copy, and the schema gate
    # in front of the services. It is a tool, not a collector: rolling
    # it to the new image before the gate is safe, and it is what makes
    # the migration run the deployed code, and the gate ask the deployed
    # code's head, instead of the code of some earlier deploy.
    #
    # Not under `verify`: a check alone must not move the console to
    # whatever master is now. The checks use the console as it stands.
    - name: Render the console
      ansible.builtin.template:
        src: k8s/console.yml.j2
        dest: "{{ transfer_dir }}/console.yml"
        mode: "0600"
      register: console_rendered
      tags: [prepare, data, migrate, session, services]

    - name: Apply the console
      ansible.builtin.command: >-
        {{ kubectl }} apply --server-side --field-manager=itgraph
        -f {{ transfer_dir }}/console.yml
      register: console_applied
      changed_when: "'configured' in console_applied.stdout or 'created' in console_applied.stdout"
      tags: [prepare, data, migrate, session, services]

    - name: The console is up
      ansible.builtin.command: >-
        {{ kubectl }} rollout status deploy/itgraph-console --timeout=180s
      changed_when: false
      tags: [prepare, data, migrate, session, services]

    - name: Remove the rendered console from the host
      ansible.builtin.file:
        path: "{{ transfer_dir }}/console.yml"
        state: absent
      tags: [prepare, data, migrate, session, services]

    # The exit check, run wherever the proxy is deployed or checked.
    # `api.ipify.org` answers over IPv4 only, so both readings are
    # comparable. This is what catches a proxy that accepts connections
    # and sends them out from the host's own address — a state in which
    # the collector's route line is correct and the exit is not.
    #
    # The proxy credentials reach curl through the environment
    # (`ALL_PROXY=`), expanded by the shell inside the console: never
    # an argument, where /proc would show them.
    - name: The address the host leaves from
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        curl -fsS --max-time 20 https://api.ipify.org
      register: direct_address
      changed_when: false
      tags: [prepare, verify]

    - name: The address the proxy leaves from
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} exec deploy/itgraph-console -c itgraph --
          sh -c 'ALL_PROXY="socks5://${PROXY_USERNAME}:${PROXY_PASSWORD}@${PROXY_HOST}:${PROXY_PORT}"
          curl -fsS --max-time 20 https://api.ipify.org'
      register: proxied_address
      changed_when: false
      tags: [prepare, verify]

    - name: The exit is the VPN's
      ansible.builtin.assert:
        that:
          - direct_address.stdout | length > 0
          - proxied_address.stdout | length > 0
          - direct_address.stdout != proxied_address.stdout
        fail_msg: >-
          The two addresses must both answer and must differ: this host
          leaves from {{ direct_address.stdout | default("?", true) }},
          the proxy from {{ proxied_address.stdout | default("?", true) }}.
          A proxy that answers with the host's own address is sending
          traffic out directly — the one state the collector's own
          route line cannot catch. Check proxy_outbound in the vault
          against the VPN client configuration it came from.
        quiet: true
      tags: [prepare, verify]

    # --------------------------------------------------------------- data

    - name: Render Postgres
      ansible.builtin.template:
        src: k8s/postgres.yml.j2
        dest: "{{ transfer_dir }}/postgres.yml"
        mode: "0600"
      tags: [data, migrate]

    - name: Apply Postgres
      ansible.builtin.command: >-
        {{ kubectl }} apply --server-side --field-manager=itgraph
        -f {{ transfer_dir }}/postgres.yml
      register: postgres_applied
      changed_when: "'configured' in postgres_applied.stdout or 'created' in postgres_applied.stdout"
      tags: [data, migrate]

    - name: Remove the rendered Postgres from the host
      ansible.builtin.file:
        path: "{{ transfer_dir }}/postgres.yml"
        state: absent
      tags: [data, migrate]

    # The readiness probe is pg_isready over the local socket, so this
    # waits for a database that answers, not only for a pod that
    # exists.
    - name: Wait for Postgres
      ansible.builtin.command: >-
        {{ kubectl }} rollout status statefulset/itgraph-postgres
        --timeout=300s
      changed_when: false
      tags: [data, migrate]

    # Roles are cluster-level and `pg_dump` does not carry them, but the
    # GRANTs in the dump reference this one — so it has to exist before the
    # restore or those statements fail. NOLOGIN until a password is set.
    - name: Bot role exists before anything references it
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ postgres_pod }} --
        psql -U {{ db_user }} -d postgres -tAc
        "DO $$ BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='itgraph_bot')
          THEN CREATE ROLE itgraph_bot NOLOGIN;
                RAISE NOTICE 'role_created';
          END IF;
        END $$;"
      register: bot_role
      changed_when: "'role_created' in bot_role.stderr"
      tags: [data]

    # Two statements where one would read more naturally, because one
    # cannot do it: SQL resolves a table name when it parses the
    # statement, so on a fresh database `SELECT count(*) FROM channels`
    # fails as a whole, a `CASE` guarding it included. The first question
    # tells a fresh database from the rest; only then is anything counted.
    #
    # Both fail on an error. An error read as an empty answer parses as
    # zero channels, and zero channels is the one answer that leads to a
    # restore — a probe that could not see the data must not be the
    # reason it gets replaced.
    - name: Is there a channels table
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ postgres_pod }} --
        psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT to_regclass('public.channels') IS NULL"
      register: channels_table
      changed_when: false
      failed_when: >-
        channels_table.rc != 0
        or channels_table.stdout | trim not in ['t', 'f']
      tags: [data, migrate]

    - name: How much is already in this database
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ postgres_pod }} --
        psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM channels"
      register: existing_channels
      changed_when: false
      when: channels_table.stdout | trim == 'f'
      tags: [data, migrate]

    # Rows are not the same thing as a database. An interrupted
    # `pg_restore --clean` drops the enum types, recreates them with new
    # OIDs and stops part way, leaving columns pointing at OIDs that no
    # longer exist. Postgres answers any query touching them with
    # "cache lookup failed for type NNNN", which surfaces as a SQLAlchemy
    # traceback in a service log days later and names nothing useful.
    #
    # This is the check that tells wreckage from data. It reads only the
    # catalog, so it answers on an empty database too — zero — and an
    # error here is an error, not a clean bill of health.
    - name: Is what is already here internally consistent
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ postgres_pod }} --
        psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM pg_attribute a
         JOIN pg_class c ON c.oid = a.attrelid AND c.relkind = 'r'
         JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'
         WHERE a.attnum > 0 AND NOT a.attisdropped
           AND NOT EXISTS (SELECT 1 FROM pg_type t WHERE t.oid = a.atttypid)"
      register: dangling_types
      changed_when: false
      tags: [data, migrate]

    # `restore_selected` exists for one combination: `force_restore` under
    # a tag selection that will not run the restore, such as
    # `--tags migrate`. Without it the flag would lift the stop below and
    # the migration would then run on the very database it was meant to
    # replace.
    - name: Decide whether to restore
      ansible.builtin.set_fact:
        channel_count: "{{ found | int }}"
        restore_needed: "{{ found | int == 0 or forced | bool }}"
        database_broken: "{{ found | int > 0 and dangling_types.stdout | trim | int > 0 }}"
        restore_selected: >-
          {{ ansible_run_tags | intersect(['all', 'tagged', 'data']) | length > 0
             and 'data' not in ansible_skip_tags }}
      vars:
        found: >-
          {{ 0 if channels_table.stdout | trim == 't'
             else existing_channels.stdout | trim | int }}
        forced: "{{ force_restore | default(false) | bool }}"
      tags: [data, migrate]

    # The restore comes from `itgraph_dump_src`, on the operator's
    # machine, and that dump is older than anything a collecting host has
    # gathered since. Restoring it over a database that holds channels
    # trades whatever is broken for everything collected after the dump —
    # metric snapshots included, which cannot be taken again. So a broken
    # database with channels in it stops the deploy rather than being
    # replaced: nothing is migrated on it and nothing is started on it.
    #
    # On a host that never collected — a first restore that stopped part
    # way — restoring again is the fix, and the flag costs nothing there.
    - name: A broken database stops the deploy
      ansible.builtin.assert:
        that: >-
          not database_broken | bool
          or (force_restore | default(false) | bool and restore_selected | bool)
        fail_msg: >-
          {{ dangling_types.stdout | trim }} column(s) reference a type that
          no longer exists, in a database holding {{ channel_count }}
          channels — the sign of a `pg_restore` that did not finish.
          Stopping before anything is restored, migrated or started. A
          restore here would come from {{ itgraph_dump_src }} on the
          operator's machine, which is older than whatever this host has
          collected since. On a host that has been collecting, restore from
          its own dumps in the backups volume instead
          (src/itgraph/README.md, «Восстановление»). Only on a host that
          never collected, re-run with -e force_restore=true and the data
          tasks selected — `--tags migrate` alone never restores.
        quiet: true
      tags: [data, migrate]

    - name: Say so when the restore is skipped
      ansible.builtin.debug:
        msg: >-
          Restore skipped: {{ channel_count }} channels already here and the
          schema is coherent, so they are kept. Only -e force_restore=true
          would replace them, with {{ itgraph_dump_src }} from the
          operator's machine.
      when: not restore_needed | bool
      tags: [data]

    # The one destructive step in the playbook. A re-run must not be a way
    # to lose the hand-reviewed inventory, so it happens only into a
    # database with no channels in it, unless the operator says otherwise
    # on the command line. One block so the condition is stated once:
    # `when` on a block is applied to every task in it, and evaluated
    # before each — safe here because nothing inside changes
    # `restore_needed`.
    - name: Restore from the operator's dump
      when: restore_needed | bool
      tags: [data]
      block:
        # `copy`, not `synchronize`: rsync would have to be on the host,
        # and the deploy installs nothing there — a missing rsync would
        # surface here, mid-cutover, with the old host already stopped.
        # `copy` goes over the SSH connection itself, as a file transfer
        # rather than as module arguments, and follows a symlink on this
        # side (`local_follow`), so a dump path through `…-LATEST.dump`
        # sends the dump and not a link dangling at a name that exists
        # only here.
        - name: Ship the dump
          ansible.builtin.copy:
            src: "{{ itgraph_dump_src }}"
            dest: "{{ transfer_dir }}/itgraph.dump"
            mode: "0600"

        # Checked before the restore rather than after: `pg_restore`
        # reading a missing or empty file reports it as a shell redirect
        # error, which names neither the dump nor the reason.
        - name: The dump arrived
          ansible.builtin.stat:
            path: "{{ transfer_dir }}/itgraph.dump"
          register: shipped_dump

        - name: The dump is a real file with something in it
          ansible.builtin.assert:
            that:
              - shipped_dump.stat.exists
              - shipped_dump.stat.isreg
              - shipped_dump.stat.size > 0
            fail_msg: >-
              {{ transfer_dir }}/itgraph.dump did not arrive as a readable
              file. Check that {{ itgraph_dump_src }} exists on this
              machine — at the cutover, the operator copies it from the
              previous host into a 0700 directory and points
              itgraph_dump_src at it.
            quiet: true

        # Through the transfer file, not through Ansible's `stdin`:
        # a dump is not text.
        - name: Restore
          ansible.builtin.shell: >-
            {{ kubectl }} exec -i {{ postgres_pod }} --
            pg_restore -U {{ db_user }} -d {{ db_name }}
            --no-owner --clean --if-exists < {{ transfer_dir }}/itgraph.dump
          args:
            executable: /bin/bash
          register: restore_result
          changed_when: true

        # `pg_restore` exits zero on a partial restore more readily than
        # one would like, and the damage it leaves is invisible until
        # something queries an affected column. Asked here, where the
        # answer can still stop the deployment, rather than at 03:00 in a
        # job log.
        - name: The restored database is coherent
          ansible.builtin.command: >-
            {{ kubectl }} exec {{ postgres_pod }} --
            psql -U {{ db_user }} -d {{ db_name }} -tAc
            "SELECT count(*) FROM pg_attribute a
             JOIN pg_class c ON c.oid = a.attrelid AND c.relkind = 'r'
             JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'
             WHERE a.attnum > 0 AND NOT a.attisdropped
               AND NOT EXISTS (SELECT 1 FROM pg_type t WHERE t.oid = a.atttypid)"
          register: dangling_after
          changed_when: false

        - name: Nothing points at a type that is gone
          ansible.builtin.assert:
            that: dangling_after.stdout | trim | int == 0
            fail_msg: >-
              The restore left {{ dangling_after.stdout | trim }} column(s)
              referencing a type that no longer exists, so it did not finish.
              Queries touching them fail with "cache lookup failed for type".
              Wipe and try again — `{{ kubectl }} delete statefulset
              itgraph-postgres; {{ kubectl }} delete pvc itgraph-database`,
              re-run the playbook — and check the dump restores on the
              machine that made it.
            quiet: true

      # Whatever happened above: the dump is the operator's whole
      # inventory, subscriptions included, and the volume is where it
      # belongs now — not a file left in /root by a run that failed.
      always:
        - name: Remove the dump from the host after the restore
          ansible.builtin.file:
            path: "{{ transfer_dir }}/itgraph.dump"
            state: absent

    # Unconditional: also clears a dump left behind by an earlier run
    # that was killed outright, where not even `always` ran.
    - name: Remove the dump from the host
      ansible.builtin.file:
        path: "{{ transfer_dir }}/itgraph.dump"
        state: absent
      tags: [data]

    # The password goes in on stdin, not in the command line: `no_log`
    # hides it from Ansible's output but does nothing about /proc, where
    # an argument is readable by any local user for as long as psql runs.
    #
    # `''` is SQL's own escape for a quote inside a literal. Not the
    # `quote` filter — that is *shell* quoting, and it returns a bare
    # word for anything shell-safe, so an ordinary password would arrive
    # as `PASSWORD hunter2` and be a syntax error.
    #
    # ON_ERROR_STOP because `psql -f` exits 0 on a failed statement. Then
    # the role keeps its NOLOGIN password, the playbook says `changed`,
    # and the bot cannot connect for a reason nothing here reported.
    - name: Give the bot role its password
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} exec -i {{ postgres_pod }} --
          psql -U {{ db_user }} -d {{ db_name }} -v ON_ERROR_STOP=1 -f -
        stdin: >-
          ALTER ROLE itgraph_bot LOGIN PASSWORD
          '{{ bot_db_password | replace("'", "''") }}'
      changed_when: true
      no_log: true
      tags: [data]

    # The dump carries the schema as of the moment it was taken, so a
    # dump older than a migration restores a database that is quietly
    # behind — and a host that has been collecting for weeks is behind
    # the moment code with a new migration is deployed. Either way the
    # failure would land on a schedule, at night, on a machine nobody is
    # watching, so the schema reaches head here, before anything starts.
    #
    # In the console, which is already on the new image: the migration
    # runs the deployed code, not the code of some earlier deploy.
    #
    # Asked before it is done, because `alembic upgrade` is not free on a
    # working database: env.py takes a full dump first and then prunes
    # the weekly tier to four, whether or not anything is pending. An
    # upgrade on every run would let four re-runs in an evening push out
    # every dump older than the evening. `current` takes no dump — env.py
    # dumps on `upgrade` only.
    #
    # The matched text is alembic's own DatabaseNotAtHead. Anything else —
    # no Secret, Postgres unreachable, a traceback — stops here with its
    # own output, rather than being read as "behind" and tried.
    - name: Is the schema at head
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        alembic current --check-heads
      register: schema_check
      changed_when: false
      failed_when:
        - schema_check.rc != 0
        - "'Database is not on all head revisions' not in (schema_check.stdout ~ schema_check.stderr)"
      tags: [data, migrate]

    - name: Where the schema starts
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        alembic current
      register: schema_before
      changed_when: false
      when: schema_check.rc != 0
      tags: [data, migrate]

    - name: Bring the schema to head
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        alembic upgrade head
      register: schema_upgrade
      changed_when: true
      when: schema_check.rc != 0
      tags: [data, migrate]

    # env.py logs where it dumped to on stderr, through the `alembic`
    # logger that alembic.ini sends there. Kept for the report: it is the
    # file to reach for if this migration has to be undone. Empty when
    # the database had no tables, which env.py migrates without a dump.
    - name: Where the pre-migration dump went
      ansible.builtin.set_fact:
        migration_dump: >-
          {{ schema_upgrade.stderr | regex_search('backed up to [^ ]+')
             | default('', true) | regex_replace('^backed up to ', '') }}
      when: schema_check.rc != 0
      tags: [data, migrate]

    # Also tagged `services`, and that is what it is for. Tags select tasks
    # but never reorder them, so file order protects a full run only:
    # `--tags services` on a schema that is behind is the manual path
    # minus its migration, and this gate is what stops it.
    - name: Schema is at head
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        alembic current --check-heads
      register: alembic_current
      changed_when: false
      failed_when: false
      tags: [data, migrate, services]

    - name: Nothing starts on a schema that is behind
      ansible.builtin.assert:
        that: alembic_current.rc == 0
        fail_msg: >-
          The schema is not at the head of the deployed image, so no
          workload is created, changed or restarted. Bring it there first
          — the full playbook, or --tags migrate — then the services.
          alembic said: {{ (alembic_current.stdout ~ ' ' ~ alembic_current.stderr) | trim | truncate(400) }}
        quiet: true
      tags: [data, migrate, services]

    # Said here, after the gate has named the revision reached, and not
    # only in the final report: `--tags migrate` never gets to the report,
    # and a migration nobody was told about leaves nobody knowing which
    # dump to reach for.
    - name: Say what the migration did
      ansible.builtin.debug:
        msg: >-
          Migrated {{ schema_before.stdout_lines | default([]) | last | default('empty database') }}
          → {{ alembic_current.stdout_lines | default(['?']) | last }}.
          {{ ('Pre-migration dump at ' ~ migration_dump ~ '.')
             if migration_dump | default('') | length > 0
             else 'No dump taken: the database had no tables.' }}
      when: schema_upgrade is defined and schema_upgrade is not skipped
      tags: [data, migrate]

    # `score` without baselines does nothing and says so, so a missing
    # first run is visible rather than silent — but it would still mean
    # an evening of no virality alerts for no reason. Conditional,
    # because this is the one heavy pass here and re-running the playbook
    # must not drag it in every time.
    - name: Have baselines ever been computed
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ postgres_pod }} --
        psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM baseline_runs WHERE completed_at IS NOT NULL"
      register: baseline_runs
      changed_when: false
      tags: [data]

    - name: First baseline refresh
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        itgraph baselines
      when: baseline_runs.stdout | trim | int == 0
      changed_when: true
      tags: [data]

    # ------------------------------------------------------------- session

    # Copied, never created. `itgraph login` on a fresh volume produces a
    # session with an empty entity cache, and every seed channel is then
    # skipped for want of a cached peer — days of stopped collection,
    # caused by a step that looks like ordinary setup.
    #
    # And copied only into a volume that has none. Once collection runs
    # here, the session lives in the volume and nowhere else — a second
    # copy on the operator's machine is a second full key to the account.
    - name: Is there a usable session in the volume
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        sh -c 'test -f {{ session_volume_path }} && test -s {{ session_volume_path }}'
      register: volume_session
      changed_when: false
      failed_when: false
      tags: [session]

    - name: Is there anything at the session path at all
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        sh -c 'test -e {{ session_volume_path }} && echo present || echo missing'
      register: session_presence
      changed_when: false
      when: volume_session.rc != 0
      tags: [session]

    # Kept only if it can be a session. An empty file, or a directory
    # left by a bad copy, would be "kept" here and collection would stop
    # on it — found in a pod log, not on this screen.
    - name: The session in the volume is a real file with something in it
      ansible.builtin.assert:
        that: session_presence.stdout | trim != "present"
        fail_msg: >-
          {{ session_volume_path }} exists in the session volume but is not
          a regular file with something in it, and nothing here replaces it
          on its own. Remove it on the host (kubectl exec into the console)
          and re-run, so the session from {{ itgraph_session_src }} is
          copied — or put the right one back by hand.
        quiet: true
      when:
        - volume_session.rc != 0
        - session_presence.stdout | default('missing') | trim == 'present'
      tags: [session]

    - name: There is a session to copy
      ansible.builtin.assert:
        that: itgraph_session_src | expanduser is file
        fail_msg: >-
          No Telegram session in the volume, and none at
          {{ itgraph_session_src }} on this machine. Copy the session from
          the machine that has been collecting to that path, or point
          itgraph_session_src at it, and re-run. Do not create one with
          `itgraph login`: a new session has an empty entity cache, and
          every seed channel would be skipped for want of a cached peer.
        quiet: true
      when:
        - volume_session.rc != 0
        - session_presence.stdout | default('missing') | trim != 'present'
      tags: [session]

    # The session moves only from a host that has stopped collecting:
    # two collectors on one session is the one state Telegram punishes
    # with a ban, and the lease cannot see across hosts. `-e
    # session_previous_host=none` states there is no such host — a lost
    # machine — and the report then says the check was skipped on
    # request.
    - name: A previous host is named, or explicitly none
      ansible.builtin.assert:
        that: session_previous_host | default('') == 'none' or groups['previous'] | default([]) | length > 0
        fail_msg: >-
          No session in the volume and no previous host to check. Name
          the host the session comes from under [previous] in the
          inventory, or state there is none with -e
          session_previous_host=none (a machine that is lost). The
          session is not copied while anything on the old host can still
          connect with it.
        quiet: true
      when:
        - volume_session.rc != 0
        - session_previous_host | default('') != 'none'
      tags: [session]

    - name: The previous host has stopped collecting
      when:
        - volume_session.rc != 0
        - session_previous_host | default('') != 'none'
      tags: [session]
      block:
        - name: The previous host's collector is stopped
          # `systemd:` has no query mode — it asserts a state, which
          # would mask exactly the drift this check exists to catch.
          ansible.builtin.command: systemctl is-active itgraph-watch  # noqa: command-instead-of-module
          register: previous_watch_active
          failed_when: false
          changed_when: false
          delegate_to: "{{ groups['previous'][0] }}"

        - name: The previous host's bot is stopped
          # `systemd:` has no query mode — it asserts a state, which
          # would mask exactly the drift this check exists to catch.
          ansible.builtin.command: systemctl is-active itgraph-bot  # noqa: command-instead-of-module
          register: previous_bot_active
          failed_when: false
          changed_when: false
          delegate_to: "{{ groups['previous'][0] }}"

        - name: The previous host's collector will not start on boot
          ansible.builtin.command: systemctl is-enabled itgraph-watch  # noqa: command-instead-of-module
          register: previous_watch_enabled
          failed_when: false
          changed_when: false
          delegate_to: "{{ groups['previous'][0] }}"

        - name: The previous host's bot will not start on boot
          ansible.builtin.command: systemctl is-enabled itgraph-bot  # noqa: command-instead-of-module
          register: previous_bot_enabled
          failed_when: false
          changed_when: false
          delegate_to: "{{ groups['previous'][0] }}"

        - name: The previous host is out of the collection business
          ansible.builtin.assert:
            that:
              - previous_watch_active.stdout | trim != 'active'
              - previous_bot_active.stdout | trim != 'active'
              - previous_watch_enabled.stdout | trim in ['disabled', 'masked', 'not-found']
              - previous_bot_enabled.stdout | trim in ['disabled', 'masked', 'not-found']
            fail_msg: >-
              {{ groups['previous'][0] }}: itgraph-watch is
              {{ previous_watch_active.stdout | trim }} and
              {{ previous_watch_enabled.stdout | trim }},
              itgraph-bot is {{ previous_bot_active.stdout | trim }} and
              {{ previous_bot_enabled.stdout | trim }}. Two collectors
              on one session is the one state Telegram answers with a
              ban; stop and disable both on that host, and re-run.
            quiet: true

    - name: Copy the session
      when:
        - volume_session.rc != 0
        - session_presence.stdout | default('missing') | trim != 'present'
      tags: [session]
      block:
        # `copy` for the dump's reason: nothing on the host to rely on
        # but the SSH connection.
        - name: Ship the session
          ansible.builtin.copy:
            src: "{{ itgraph_session_src }}"
            dest: "{{ transfer_dir }}/itgraph.session"
            mode: "0600"

        # Into the volume through the transfer file — bytes, not text,
        # so not through Ansible's `stdin` — and readable by the
        # workloads' user only.
        - name: The session lands in the volume
          ansible.builtin.shell: >-
            {{ kubectl }} exec -i deploy/itgraph-console -c itgraph --
            sh -c 'cat > {{ session_volume_path }} &&
            chmod 600 {{ session_volume_path }}'
            < {{ transfer_dir }}/itgraph.session
          args:
            executable: /bin/bash
          changed_when: true

        - name: The session's checksum on the host
          ansible.builtin.command: sha256sum {{ transfer_dir }}/itgraph.session
          register: shipped_session_sum
          changed_when: false

        - name: The session's checksum in the volume
          ansible.builtin.command: >-
            {{ kubectl }} exec deploy/itgraph-console -c itgraph --
            sha256sum {{ session_volume_path }}
          register: volume_session_sum
          changed_when: false

        # The copy crossed a shell and a kubelet; a truncated session
        # fails exactly like a missing one, but later and further away.
        - name: The session arrived whole
          ansible.builtin.assert:
            that: >-
              shipped_session_sum.stdout.split()[0]
              == volume_session_sum.stdout.split()[0]
            fail_msg: >-
              The session in the volume does not checksum to what was
              sent: {{ shipped_session_sum.stdout.split()[0] }} became
              {{ volume_session_sum.stdout.split()[0] }}. Nothing here
              retries on its own — re-run after clearing
              {{ session_volume_path }} in the volume.
            quiet: true

      # Whatever happened above: the session is a full key to the
      # account, and a failed copy must not leave a second one in /root.
      always:
        - name: Remove the session from the host after the copy
          ansible.builtin.file:
            path: "{{ transfer_dir }}/itgraph.session"
            state: absent

    # Unconditional: also clears a session left behind by an earlier run
    # that was killed outright, where not even `always` ran. The volume
    # has the only copy that should remain.
    - name: Remove the session from the host
      ansible.builtin.file:
        path: "{{ transfer_dir }}/itgraph.session"
        state: absent
      tags: [session]

    # A copy made without consulting the previous host says so in the
    # same breath: that is the one copy the operator vouched for by hand.
    - name: What happened to the session
      ansible.builtin.set_fact:
        session_report: >-
          {{ ('copied' ~ (', previous-host check skipped on request'
                          if session_previous_host | default('') == 'none'
                          else ', previous host checked and stopped'))
               if shipped_session_sum is defined
                  and shipped_session_sum is not skipped
             else 'kept (the volume has one)'
               if volume_session.rc | default(1) == 0
             else 'not run' }}
      tags: [session]

    # ------------------------------------------------------------ services

    # `scripts/on-host.sh --loop stop` scales the collector to zero for a
    # command that needs the session. A deploy then must not start it
    # behind the operator's back — the command holds the lease, and the
    # new collector would only crash-loop on it — and it could not
    # quietly anyway: the templates own `replicas: 1` through server-side
    # apply, `kubectl scale` set it to 0, and the apply would stop on a
    # field conflict that names neither. So the question is asked first,
    # and answered in words. Nothing found means a fresh host.
    - name: What the collector and the bot are scaled to
      ansible.builtin.command: >-
        {{ kubectl }} get deploy itgraph-watch itgraph-bot --ignore-not-found
        -o jsonpath='{range .items[*]}{.metadata.name}={.spec.replicas}{" "}{end}'
      register: current_replicas
      changed_when: false
      tags: [services]

    - name: Neither is stopped by hand
      ansible.builtin.assert:
        that: "'=0' not in current_replicas.stdout"
        fail_msg: >-
          Scaled to zero by hand: {{ current_replicas.stdout | trim }}. The
          collector is stopped with `scripts/on-host.sh --loop stop` for a
          command that needs the session; let that command finish, then
          `scripts/on-host.sh --loop start` (and `k3s kubectl -n itgraph
          scale deploy/itgraph-bot --replicas=1` for the bot), and re-run.
        quiet: true
      tags: [services]

    - name: Render the services
      ansible.builtin.template:
        src: "k8s/{{ item }}.yml.j2"
        dest: "{{ transfer_dir }}/{{ item }}.yml"
        mode: "0600"
      loop:
        - watch
        - bot
        - cronjobs
      tags: [services]

    # `configured` on a Deployment or CronJob means the template changed
    # — a new digest, or a changed checksum annotation — and for the
    # long-running Deployments the controller replaces the pod. A re-run
    # of an identical deploy prints `unchanged` and restarts nothing.
    - name: Apply the services
      ansible.builtin.command: >-
        {{ kubectl }} apply --server-side --field-manager=itgraph
        -f {{ transfer_dir }}/{{ item }}.yml
      register: services_applied
      changed_when: "'configured' in services_applied.stdout or 'created' in services_applied.stdout"
      loop:
        - watch
        - bot
        - cronjobs
      tags: [services]

    - name: Remove the rendered services from the host
      ansible.builtin.file:
        path: "{{ transfer_dir }}/{{ item }}.yml"
        state: absent
      loop:
        - watch
        - bot
        - cronjobs
      tags: [services]

    # An object that left the templates is deleted explicitly, never by
    # pruning — pruning is one label mistake away from deleting a volume
    # claim. `--ignore-not-found`, because a host that never had a key
    # has nothing to delete.
    - name: Delete the YouTube jobs when there is no key
      ansible.builtin.command: >-
        {{ kubectl }} delete cronjob itgraph-yt-watch itgraph-yt-refresh
        --ignore-not-found
      register: youtube_deleted
      changed_when: "'deleted' in youtube_deleted.stdout"
      when: youtube_api_key | default('') | length == 0
      tags: [services]

    - name: The collector is rolled out
      ansible.builtin.command: >-
        {{ kubectl }} rollout status deploy/itgraph-watch --timeout=180s
      changed_when: false
      tags: [services]

    - name: The bot is rolled out
      ansible.builtin.command: >-
        {{ kubectl }} rollout status deploy/itgraph-bot --timeout=180s
      changed_when: false
      tags: [services]

    # A rollout reported complete only means a pod exists. Crash-looping
    # counts as available to the Deployment controller, so the pods are
    # watched for a settling period and a restart fails the deploy —
    # here, where the name and the exit are still on the screen.
    #
    # A restart *during this deploy*, that is. The collector exits on
    # purpose when it stops making progress, and the cluster restarts
    # it; one such restart last week must not fail every deploy after
    # it. So the counts are read per pod before the settling minute and
    # after it, and must not move; a pod this run created must have none
    # at all; and every pod must be ready at the end — one in
    # CrashLoopBackOff can sit out the whole minute between restarts
    # with its count unchanged.
    - name: Restarts before settling
      ansible.builtin.command: >-
        {{ kubectl }} get pods -l app={{ item }}
        -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount}{" "}{end}'
      register: restarts_before
      changed_when: false
      loop:
        - itgraph-watch
        - itgraph-bot
      tags: [services]

    - name: Let them settle
      ansible.builtin.pause:
        seconds: 60
      tags: [services]

    - name: Restarts after settling
      ansible.builtin.command: >-
        {{ kubectl }} get pods -l app={{ item }}
        -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount}{" "}{end}'
      register: restarts_after
      changed_when: false
      loop:
        - itgraph-watch
        - itgraph-bot
      tags: [services]

    - name: Readiness after settling
      ansible.builtin.command: >-
        {{ kubectl }} get pods -l app={{ item }}
        -o jsonpath='{range .items[*]}{.status.containerStatuses[0].ready}{" "}{end}'
      register: readiness
      changed_when: false
      loop:
        - itgraph-watch
        - itgraph-bot
      tags: [services]

    - name: How it last exited
      ansible.builtin.command: >-
        {{ kubectl }} get pods -l app={{ item }}
        -o jsonpath='{.items[*].status.containerStatuses[0].lastState.terminated.exitCode}
        {.items[*].status.containerStatuses[0].lastState.terminated.reason}'
      register: last_exits
      changed_when: false
      failed_when: false
      loop:
        - itgraph-watch
        - itgraph-bot
      tags: [services]

    - name: Neither service restarted during the deploy
      ansible.builtin.assert:
        # The last condition: a pod this run created — its template was
        # `configured` in the apply — must not have restarted at all.
        that:
          - after == before
          - ready == 'true'
          - >-
            (item | replace('itgraph-', '')) not in rolled_here
            or after | regex_findall('=([0-9]+)') | map('int') | sum == 0
        fail_msg: >-
          {{ item }} is not running cleanly: restarts {{ before or 'none' }}
          before settling and {{ after or 'none' }} after, ready
          "{{ ready }}", rolled out by this run:
          {{ 'yes' if (item | replace('itgraph-', '')) in rolled_here else 'no' }};
          last exited {{ last_exits.results[index].stdout | default('?', true) }}.
          A rollout reported complete is not proof that it runs — see
          `{{ kubectl }} describe pod -l app={{ item }}` and its logs.
        quiet: true
      vars:
        before: "{{ restarts_before.results[index].stdout | trim }}"
        after: "{{ restarts_after.results[index].stdout | trim }}"
        ready: "{{ readiness.results[index].stdout | trim }}"
        rolled_here: "{{ services_applied.results | default([]) | selectattr('changed') | map(attribute='item') | list }}"
      loop:
        - itgraph-watch
        - itgraph-bot
      loop_control:
        index_var: index
      tags: [services]

    # --------------------------------------------------------------- verify

    - name: The inventory came across
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ postgres_pod }} --
        psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM channels WHERE status='seed'"
      register: seed_count
      changed_when: false
      tags: [verify]

    - name: There are seed channels to collect
      ansible.builtin.assert:
        that: seed_count.stdout | trim | int > 0
        fail_msg: "No seed channels — the restore did not land."
        quiet: true
      tags: [verify]

    # Reads the line `build_client` logs at connect time. A deployment
    # whose Secret did not arrive works, logs nothing unusual, and
    # reaches Telegram from the address the proxy exists to hide — this
    # is the only thing that catches it.
    #
    # From the running `watch`'s current container, which logs that line
    # once per start. Retried, because a collector started a moment ago
    # may not have connected yet; a `direct` line and no line at all
    # fail below with different messages, because they mean different
    # things.
    - name: The route the running collector took
      ansible.builtin.command: >-
        {{ kubectl }} logs deploy/itgraph-watch -c itgraph
      register: watch_route
      until: "'Telegram route:' in watch_route.stdout"
      retries: 15
      delay: 2
      changed_when: false
      failed_when: false
      tags: [verify]

    # The line is logged once per start, and the kubelet rotates
    # container logs: a collector that has run for months may no longer
    # have it in the file `kubectl logs` reads. Only then — no line, and
    # a container that started over an hour ago — is the route read from
    # the running container's environment instead, which is where the
    # line's values come from. A collector without the line that started
    # recently has not got as far as connecting, and that fails below.
    - name: How long the collector has been running
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          started=$({{ kubectl }} get pods -l app=itgraph-watch
          -o jsonpath='{.items[0].status.containerStatuses[0].state.running.startedAt}');
          test -n "$started" && echo $(( $(date +%s) - $(date -d "$started" +%s) ))
        executable: /bin/bash
      register: watch_uptime
      changed_when: false
      failed_when: false
      when: "'Telegram route:' not in watch_route.stdout"
      tags: [verify]

    - name: The route, from the environment of a long-running collector
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-watch -c itgraph --
        printenv PROXY_TYPE PROXY_HOST PROXY_PORT
      register: watch_proxy_env
      changed_when: false
      failed_when: false
      when:
        - "'Telegram route:' not in watch_route.stdout"
        - watch_uptime.stdout | default('') | trim | int > 3600
      tags: [verify]

    - name: Say so when the route came from the environment
      ansible.builtin.debug:
        msg: >-
          itgraph-watch has run for {{ watch_uptime.stdout | trim }} s and
          its "Telegram route:" line has rotated out of the log; the
          route was read from its environment instead:
          {{ watch_proxy_env.stdout_lines | join(' ') }}.
      when: watch_proxy_env is defined and watch_proxy_env is not skipped
      tags: [verify]

    - name: The collector says which route it took
      ansible.builtin.assert:
        that: >-
          'Telegram route:' in watch_route.stdout
          or (watch_proxy_env is defined and watch_proxy_env is not skipped
              and watch_proxy_env.rc == 0)
        fail_msg: >-
          itgraph-watch has logged no "Telegram route:" line since it
          started, so which way it reaches Telegram is unknown. It is
          likely not starting at all — refused the session lease, or
          failing before it connects. See `{{ kubectl }} logs
          deploy/itgraph-watch -c itgraph`.
        quiet: true
      tags: [verify]

    - name: The proxy is actually in use
      ansible.builtin.assert:
        that: "'Telegram route: direct' not in watch_route.stdout"
        fail_msg: >-
          Connected directly. PROXY_* did not reach the process — check
          the itgraph-env Secret and the Deployment's envFrom.
        quiet: true
      tags: [verify]

    # Not direct is not yet enough: the route must be the namespace's
    # own proxy, the one whose exit was just checked.
    - name: The route is the namespace's proxy
      ansible.builtin.assert:
        that: >-
          ('Telegram route: socks5 proxy at itgraph-proxy:1080' in watch_route.stdout)
          if 'Telegram route:' in watch_route.stdout
          else (watch_proxy_env.stdout_lines | default([])
                == ['socks5', 'itgraph-proxy', '1080'])
        fail_msg: >-
          The collector reaches Telegram through something other than
          itgraph-proxy:1080 — not the proxy whose exit this deploy
          checked. Check PROXY_* in the itgraph-env Secret.
        quiet: true
      tags: [verify]

    # The address check runs again here under its own tags, after the
    # collector is up: the two readings and their comparison are the
    # tasks above, tagged [prepare, verify].

    - name: What the collector says about itself
      ansible.builtin.command: >-
        {{ kubectl }} exec deploy/itgraph-console -c itgraph --
        itgraph watch-status
      register: watch_status
      changed_when: false
      tags: [verify]

    # What this run did, beside what the host says about itself. Every
    # field reads its source through `default`: a part that was not
    # selected in this run registered nothing, and "not run" is the
    # honest answer for it — a skipped restore reported as done is
    # exactly the mistake a re-run that skips instead of stopping makes
    # easy.
    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ itgraph_commit | default('commit not resolved') }} ·
          {{ itgraph_image | default('image not resolved') }} ·
          {{ seed_count.stdout | trim | default('0', true) }} seed channels ·
          restore: {{ restore_report }} ·
          session: {{ session_report | default('not run') }} ·
          migration: {{ migration_report }} ·
          {{ alembic_current.stdout_lines | default(['schema not checked']) | last }} ·
          restarted: {{ restart_report }} ·
          {{ watch_status.stdout_lines | join(' · ') }}
      vars:
        restore_report: >-
          {{ 'restored'
               if restore_result is defined and restore_result is not skipped
             else 'skipped (' ~ channel_count ~ ' channels kept)'
               if restore_needed is defined and not restore_needed | bool
                  and restore_selected | bool
             else 'not run' }}
        migration_report: >-
          {{ (schema_before.stdout_lines | default([]) | last | default('empty database'))
               ~ ' → ' ~ (alembic_current.stdout_lines | default(['?']) | last)
               ~ (', dump at ' ~ migration_dump
                  if migration_dump | default('') | length > 0
                  else ', no dump taken')
               if schema_upgrade is defined and schema_upgrade is not skipped
             else 'none needed' if schema_check is defined
             else 'not run' }}
        restart_report: >-
          {{ (services_applied.results | default([])
               | selectattr('item', 'in', ['watch', 'bot'])
               | selectattr('changed')
               | map(attribute='item') | map('regex_replace', '^', 'itgraph-')
               | join(', ')) or 'none'
               if services_applied is defined
             else 'not run' }}
      tags: [verify]

    # Last, and on every tag selection: what is left in the transfer
    # directory is a dump, a session or a rendered Secret from a run
    # that stopped between writing a file and removing it.
    - name: Remove the transfer directory
      ansible.builtin.file:
        path: "{{ transfer_dir }}"
        state: absent
      tags: [always]
