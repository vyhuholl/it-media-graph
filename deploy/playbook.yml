---
# Bring up collection on a fresh Ubuntu host.
#
# What this playbook will not do, deliberately:
#
#   * run `itgraph login`. The session file is copied from the operator's
#     machine, because it carries the entity cache `cached_peer` reads and
#     a fresh session has none — every seed channel would be skipped for
#     want of a cached peer, recoverable only through `resolve` at a
#     couple of hundred usernames a day.
#   * restore over a database that already has rows. See the guard in the
#     `data` tasks: a re-run must not be a way to lose the inventory.
#   * stop the collector still running on the operator's machine. That
#     stays a human decision, taken after the verification below passes.
#
# Usage:
#   ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass
#   ansible-playbook -i inventory.ini playbook.yml --tags services
#   ansible-playbook -i inventory.ini playbook.yml --tags verify

- name: Deploy itgraph collection
  hosts: collector
  become: false

  vars:
    repo_dir: "/home/{{ ansible_user }}/itgraph"
    uv: "/home/{{ ansible_user }}/.local/bin/uv"

  pre_tasks:
    - name: Refuse to run without the things only the operator has
      ansible.builtin.assert:
        that:
          - itgraph_session_src is defined
          - itgraph_dump_src is defined
          - telegram_api_hash is defined
          - bot_db_password is defined
        fail_msg: >-
          Set itgraph_session_src and itgraph_dump_src in
          group_vars/all/main.yml, and the secrets in
          group_vars/all/secrets.vault.yml — note the `all/` directory,
          a file named group_vars/secrets.vault.yml is read as variables
          for a group called `secrets.vault` and silently ignored.
          Nothing here can be invented for you.
        quiet: true
      tags: [always]

  tasks:

    # ---------------------------------------------------------------- base

    - name: Base packages
      become: true
      ansible.builtin.apt:
        name: [git, curl, rsync, ca-certificates]
        update_cache: true
        cache_valid_time: 3600
      tags: [base]

    - name: Is docker already here
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: false
      tags: [base]

    # `pipefail` is not decoration: without it a failed download leaves
    # `sh` reading empty input, exiting zero, and Ansible reporting a
    # successful install of nothing.
    - name: Install docker
      become: true
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
        executable: /bin/bash
      when: docker_version.rc != 0
      changed_when: true
      tags: [base]

    - name: Let the deploy user talk to docker
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      tags: [base]

    # Reconnect so the new group membership is in effect; without this
    # every later `docker` call needs sudo, which is worse.
    - name: Pick up the docker group
      ansible.builtin.meta: reset_connection
      tags: [base]

    - name: Is uv already here
      ansible.builtin.stat:
        path: "{{ uv }}"
      register: uv_binary
      tags: [base]

    # uv, not apt: this project needs Python 3.14 and pins it, and Ubuntu
    # does not ship it. Bare `python`/`pip` are forbidden here anyway.
    - name: Install uv
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | sh
        executable: /bin/bash
      when: not uv_binary.stat.exists
      changed_when: true
      tags: [base]

    # Why an update at all: uv carries its own index of downloadable
    # interpreters, so a uv older than the pinned Python cannot fetch it.
    # `uv python install` then answers "No download found" and `uv sync`
    # "No interpreter found", neither of which points at uv's age.
    # Installing only when absent left a host carrying uv from some
    # earlier day quietly unable to build the environment.
    #
    # **Best effort, and deliberately unable to fail the run.** The
    # update is a means; the requirement is that the pinned interpreter
    # installs, and that is asserted after the clone where the message
    # can say so. This step reaches raw.githubusercontent.com, which is
    # not reachable from every network a collector runs on, and stopping
    # a deployment because an update server timed out would trade a real
    # problem for an imaginary one.
    #
    # Bounded by `timeout` because `uv self update` retries for about
    # ninety seconds before giving up — ninety seconds spent on every run
    # of a step that is allowed to fail.
    - name: Keep uv current
      ansible.builtin.command: "timeout 20 {{ uv }} self update"
      register: uv_update
      changed_when: "'pgraded' in uv_update.stdout"
      failed_when: false
      when: uv_binary.stat.exists
      tags: [base]

    - name: Say so when uv could not be updated
      ansible.builtin.debug:
        msg: >-
          uv could not check for updates (rc={{ uv_update.rc }}). Harmless
          on its own. But if the pinned Python fails to install below, a
          uv older than that release is the likely reason — it carries its
          own index of what is downloadable.
      when:
        - uv_binary.stat.exists
        - uv_update.rc | default(0) != 0
      tags: [base]

    - name: Firewall allows ssh and nothing else
      become: true
      community.general.ufw:
        rule: allow
        name: OpenSSH
      tags: [base]

    - name: Firewall on
      become: true
      community.general.ufw:
        state: enabled
        policy: deny
      tags: [base]

    # A 4 GB host with no swap hands the OOM killer an easy choice during
    # a `derive` batch, and the fattest process is Postgres.
    - name: Swap file
      become: true
      ansible.builtin.command: "{{ item }}"
      args:
        creates: /swapfile
      loop:
        - fallocate -l {{ swap_size | default('2G') }} /swapfile
      tags: [base]

    - name: Swap permissions
      become: true
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
      tags: [base]

    - name: Format swap
      become: true
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -eo pipefail
          if ! swapon --show=NAME --noheadings | grep -qx /swapfile; then
            mkswap /swapfile
            swapon /swapfile
          fi
      register: swap_on
      changed_when: "'Setting up swapspace' in swap_on.stdout"
      tags: [base]

    - name: Swap survives reboot
      become: true
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present
      tags: [base]

    # A laptop's default is to suspend when the lid closes, and a
    # suspended collector does not merely pause — the snapshots it misses
    # are gone for good. History can be re-fetched; a reading of a post's
    # counters at age thirty minutes cannot be taken later, because the
    # post will not be thirty minutes old again. That is the whole reason
    # `watch` runs as its own phase, and a closed lid quietly undoes it.
    #
    # Off by default: on a rented machine there is no lid and masking
    # sleep would be noise in the unit list.
    - name: Sleep is masked on a laptop
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target
      when: host_is_laptop | default(false) | bool
      tags: [base, laptop]

    # Belt to the masking's braces, and it earns its place: masked
    # targets make a suspend *fail*, which logind logs as an error on
    # every lid close. This makes it not try.
    #
    # A drop-in rather than an edit to logind.conf, so a package upgrade
    # replacing that file does not silently take the setting with it.
    - name: Somewhere to put the logind drop-in
      become: true
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"
      when: host_is_laptop | default(false) | bool
      tags: [base, laptop]

    - name: The lid switch does nothing on a laptop
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/10-itgraph-no-sleep.conf
        mode: "0644"
        content: |
          # Managed by Ansible. A closed lid must not stop collection:
          # missed metric snapshots cannot be taken later.
          [Login]
          HandleLidSwitch=ignore
          HandleLidSwitchExternalPower=ignore
          HandleLidSwitchDocked=ignore
      when: host_is_laptop | default(false) | bool
      notify: Reload logind
      tags: [base, laptop]

    # ---------------------------------------------------------------- repo

    - name: Clone the repository
      ansible.builtin.git:
        repo: "{{ itgraph_repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ itgraph_repo_version | default('master') }}"
        update: true
      tags: [repo]

    # The pinned interpreter, fetched explicitly rather than left to
    # `uv sync`, so a version uv cannot supply fails here — where the
    # message names Python — rather than inside a dependency install
    # that reports only "No interpreter found". Reads `.python-version`
    # from the checkout, so it has to follow the clone.
    - name: The pinned Python is available
      ansible.builtin.command: "{{ uv }} python install"
      args:
        chdir: "{{ repo_dir }}"
      register: python_install
      changed_when: "'Installed' in python_install.stderr"
      failed_when: false
      tags: [repo]

    - name: The pinned Python really installed
      ansible.builtin.assert:
        that: python_install.rc == 0
        fail_msg: >-
          Could not install the Python pinned in .python-version —
          {{ python_install.stderr | trim }}
          If that reads "No download found", the uv on this host is older
          than the pinned release and does not know it exists. Reinstall
          it by hand and re-run:
          curl -LsSf https://astral.sh/uv/install.sh | sh
        quiet: true
      tags: [repo]

    - name: Install dependencies
      ansible.builtin.command: "{{ uv }} sync"
      args:
        chdir: "{{ repo_dir }}"
      register: uv_sync
      changed_when: "'Installed' in uv_sync.stderr or 'Resolved' in uv_sync.stderr"
      tags: [repo]

    # No compose override here, deliberately. Binding Postgres to
    # loopback is done in the tracked `docker-compose.yaml`, because an
    # override cannot do it: Compose appends to a `ports` list rather
    # than replacing it, so the override published the port twice and
    # the container failed to start with "address already in use".
    #
    # A leftover `docker-compose.override.yml` from an earlier run would
    # still be picked up, so it is removed rather than merely not written.
    - name: No stale compose override
      ansible.builtin.file:
        path: "{{ repo_dir }}/docker-compose.override.yml"
        state: absent
      tags: [repo]

    - name: Configuration
      ansible.builtin.template:
        src: env.j2
        dest: "{{ repo_dir }}/.env"
        mode: "0600"
      no_log: true
      tags: [repo, config]

    # ---------------------------------------------------------------- data

    - name: Start Postgres
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ repo_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
      tags: [data]

    - name: Wait for Postgres
      ansible.builtin.command: >-
        docker exec itgraph-postgres pg_isready -U {{ db_user }} -d {{ db_name }}
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false
      tags: [data]

    # Roles are cluster-level and `pg_dump` does not carry them, but the
    # GRANTs in the dump reference this one — so it has to exist before the
    # restore or those statements fail. NOLOGIN until a password is set.
    - name: Bot role exists before anything references it
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d postgres -tAc
        "DO $$ BEGIN
           IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='itgraph_bot')
           THEN CREATE ROLE itgraph_bot NOLOGIN; END IF;
         END $$;"
      changed_when: false
      tags: [data]

    - name: How much is already in this database
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM channels"
      register: existing_channels
      changed_when: false
      failed_when: false
      tags: [data]

    # The one destructive step in the playbook. A re-run must not be a way
    # to lose the hand-reviewed inventory, so it happens only into an empty
    # database unless the operator says otherwise on the command line.
    - name: Refuse to restore over existing data
      ansible.builtin.assert:
        that: existing_channels.stdout | trim | int == 0
        fail_msg: >-
          {{ existing_channels.stdout | trim }} channels already here.
          Re-run with -e force_restore=true only if you mean to replace them.
        quiet: true
      when: not (force_restore | default(false) | bool)
      tags: [data]

    # `copy_links` is load-bearing: `itgraph_dump_src` points at
    # `full-LATEST.dump`, which is a symlink, and `synchronize` defaults
    # to `archive: yes` — rsync `-a`, which includes `-l` and copies a
    # symlink *as a symlink*. The destination then dangles at a filename
    # that exists only on the operator's machine, and the restore fails
    # with a bare "No such file or directory" that says nothing about
    # why. `-L` sends what the link points at.
    - name: Ship the dump
      ansible.posix.synchronize:
        src: "{{ itgraph_dump_src }}"
        dest: /tmp/itgraph.dump
        copy_links: true
      when: existing_channels.stdout | trim | int == 0
            or (force_restore | default(false) | bool)
      tags: [data]

    # Checked before the restore rather than after: `pg_restore` reading
    # a missing or empty file reports it as a shell redirect error, which
    # names neither the dump nor the reason.
    - name: The dump arrived
      ansible.builtin.stat:
        path: /tmp/itgraph.dump
      register: shipped_dump
      when: existing_channels.stdout | trim | int == 0
            or (force_restore | default(false) | bool)
      tags: [data]

    - name: The dump is a real file with something in it
      ansible.builtin.assert:
        that:
          - shipped_dump.stat.exists
          - shipped_dump.stat.isreg
          - shipped_dump.stat.size > 0
        fail_msg: >-
          /tmp/itgraph.dump did not arrive as a readable file. Check that
          {{ itgraph_dump_src }} exists on this machine and that
          `make backup-full` has run since the last schema change.
        quiet: true
      when: existing_channels.stdout | trim | int == 0
            or (force_restore | default(false) | bool)
      tags: [data]

    - name: Restore
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail &&
          docker exec -i itgraph-postgres
          pg_restore -U {{ db_user }} -d {{ db_name }}
          --no-owner --clean --if-exists < /tmp/itgraph.dump
      changed_when: true
      when: existing_channels.stdout | trim | int == 0
            or (force_restore | default(false) | bool)
      tags: [data]

    - name: Remove the dump from the host
      ansible.builtin.file:
        path: /tmp/itgraph.dump
        state: absent
      tags: [data]

    - name: Give the bot role its password
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -c
        "ALTER ROLE itgraph_bot LOGIN PASSWORD '{{ bot_db_password }}'"
      changed_when: true
      no_log: true
      tags: [data]

    # The dump carries the schema as of the moment it was taken, so a
    # dump older than a migration restores a database that is quietly
    # behind. Reporting `alembic current` was enough while the schema
    # only ever arrived with the data; it stopped being enough the first
    # time a pass depended on a table added after the last dump — the
    # failure lands on a timer, at night, on a machine nobody is
    # watching. Applying is idempotent and this host is fresh.
    - name: Bring the schema to head
      ansible.builtin.command: "{{ uv }} run alembic upgrade head"
      args:
        chdir: "{{ repo_dir }}"
      changed_when: true
      tags: [data]

    - name: Schema is at head
      ansible.builtin.command: "{{ uv }} run alembic current"
      args:
        chdir: "{{ repo_dir }}"
      register: alembic_current
      changed_when: false
      tags: [data]

    # `score` without baselines does nothing and says so, so a missing
    # first run is visible rather than silent — but it would still mean
    # an evening of no virality alerts for no reason. Conditional,
    # because this is the one heavy pass here and re-running the playbook
    # must not drag it in every time.
    - name: Have baselines ever been computed
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM baseline_runs WHERE completed_at IS NOT NULL"
      register: baseline_runs
      changed_when: false
      tags: [data]

    - name: First baseline refresh
      ansible.builtin.command: "{{ uv }} run itgraph baselines"
      args:
        chdir: "{{ repo_dir }}"
      when: baseline_runs.stdout | trim | int == 0
      changed_when: true
      tags: [data]

    # ------------------------------------------------------------- session

    # Copied, never created. `itgraph login` on a new machine produces a
    # session with an empty entity cache, and every seed channel is then
    # skipped for want of a cached peer — days of stopped collection,
    # caused by a step that looks like ordinary setup.
    - name: Telegram session
      ansible.builtin.copy:
        src: "{{ itgraph_session_src }}"
        dest: "{{ repo_dir }}/{{ telegram_session | default('itgraph.session') }}"
        mode: "0600"
        force: false
      tags: [session]

    # ------------------------------------------------------------ services

    - name: Unit files
      become: true
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - itgraph-watch.service
        - itgraph-bot.service
        - itgraph-alerts.service
        - itgraph-alerts.timer
        - itgraph-score.service
        - itgraph-score.timer
        - itgraph-baselines.service
        - itgraph-baselines.timer
        - itgraph-backup.service
        - itgraph-backup.timer
      notify: Reload systemd
      tags: [services]

    - name: Flush unit changes before starting anything
      ansible.builtin.meta: flush_handlers
      tags: [services]

    - name: Long-running services
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - itgraph-watch
        - itgraph-bot
      tags: [services]

    # The backup timer is the one thing whose absence looks exactly like
    # everything working: `scripts/backup-agent.sh` is launchd, so on Linux
    # nothing takes a dump until this exists.
    - name: Timers
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - itgraph-alerts.timer
        - itgraph-score.timer
        - itgraph-baselines.timer
        - itgraph-backup.timer
      tags: [services]

    # -------------------------------------------------------------- verify

    # Checked rather than assumed, for the same reason the proxy route is:
    # a laptop that still suspends looks exactly like one that does not
    # until a night has passed and the snapshots are already lost.
    - name: Sleep really is masked
      ansible.builtin.command: systemctl is-enabled sleep.target
      register: sleep_state
      changed_when: false
      failed_when: false
      when: host_is_laptop | default(false) | bool
      tags: [verify]

    - name: A laptop cannot suspend
      ansible.builtin.assert:
        that: sleep_state.stdout | trim == "masked"
        fail_msg: >-
          sleep.target is "{{ sleep_state.stdout | trim }}", not masked. A
          closed lid will stop collection, and missed metric snapshots
          cannot be taken later.
        quiet: true
      when: host_is_laptop | default(false) | bool
      tags: [verify]

    - name: The inventory came across
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM channels WHERE status='seed'"
      register: seed_count
      changed_when: false
      tags: [verify]

    - name: There are seed channels to collect
      ansible.builtin.assert:
        that: seed_count.stdout | trim | int > 0
        fail_msg: "No seed channels — the restore did not land."
        quiet: true
      tags: [verify]

    - name: One real request, to prove the session and the route
      ansible.builtin.command: >-
        {{ uv }} run itgraph backfill --since {{ ansible_date_time.date }} --limit 1
      args:
        chdir: "{{ repo_dir }}"
      register: probe
      changed_when: false
      tags: [verify]

    # Reads the line `build_client` logs at connect time. A deployment
    # whose `.env` did not arrive works, logs nothing unusual, and reaches
    # Telegram from the address the proxy exists to hide — this is the only
    # thing that catches it.
    - name: The proxy is actually in use
      ansible.builtin.assert:
        that: "'Telegram route: direct' not in probe.stderr"
        fail_msg: >-
          Connected directly. PROXY_* did not reach the process — check
          .env and the unit's WorkingDirectory.
        quiet: true
      when: proxy_host is defined and proxy_host | length > 0
      tags: [verify]

    - name: The session survived the move
      ansible.builtin.assert:
        that: "'no cached peer' not in probe.stderr"
        fail_msg: >-
          Channels are being skipped for want of a cached peer. The session
          file is not the one from the working machine.
        quiet: true
      tags: [verify]

    - name: What the collector says about itself
      ansible.builtin.command: "{{ uv }} run itgraph watch-status"
      args:
        chdir: "{{ repo_dir }}"
      register: watch_status
      changed_when: false
      tags: [verify]

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ seed_count.stdout | trim }} seed channels ·
          {{ alembic_current.stdout_lines | last }} ·
          {{ watch_status.stdout_lines | join(' · ') }}
      tags: [verify]

  handlers:
    # Handler names are matched literally and case-sensitively, and a
    # notify with no matching handler is a hard error rather than a
    # warning — so these have to read exactly as the `notify:` lines do.
    - name: Reload systemd
      become: true
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload logind
      become: true
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted
