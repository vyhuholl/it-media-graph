---
# Bring up collection on a fresh Ubuntu host, or bring a host that is
# already collecting up to date: the full run is the command for both.
#
# What this playbook will not do, deliberately:
#
#   * run `itgraph login`. The session file is copied from the operator's
#     machine — and only to a host that has none — because it carries the
#     entity cache `cached_peer` reads and a fresh session has none: every
#     seed channel would be skipped for want of a cached peer, recoverable
#     only through `resolve` at a couple of hundred usernames a day.
#   * restore over a database that already has channels. A re-run on a
#     coherent one skips the restore and carries on; on a broken one it
#     stops before migrating or starting anything (see the `data` tasks).
#     A re-run must not be a way to lose the inventory.
#   * stop the collector still running on the operator's machine. That
#     stays a human decision, taken after the verification below passes.
#
# Usage, from the repository root (ansible.cfg lives there):
#   ansible-playbook deploy/playbook.yml
#   ansible-playbook deploy/playbook.yml --tags migrate
#   ansible-playbook deploy/playbook.yml --tags services
#   ansible-playbook deploy/playbook.yml --tags verify

- name: Deploy itgraph collection
  hosts: collector
  become: false
  # Nothing here reads a fact: `ansible_user` comes from the inventory.
  # Gathering would be a round trip per run, on every tag, for nothing.
  gather_facts: false

  vars:
    repo_dir: "/home/{{ ansible_user }}/itgraph"
    uv: "/home/{{ ansible_user }}/.local/bin/uv"
    session_path: "{{ repo_dir }}/{{ telegram_session | default('itgraph.session') }}"

  pre_tasks:
    - name: Refuse to run without the things only the operator has
      ansible.builtin.assert:
        that:
          - itgraph_session_src is defined
          - itgraph_dump_src is defined
          - telegram_api_hash is defined
          - bot_db_password is defined
        fail_msg: >-
          Set itgraph_session_src and itgraph_dump_src in
          deploy/group_vars/all/main.yml, and the secrets in
          deploy/group_vars/all/secrets.vault.yml — note the `all/`
          directory, a file named group_vars/secrets.vault.yml is read as
          variables for a group called `secrets.vault` and silently ignored.
          Nothing here can be invented for you.
        quiet: true
      tags: [always]

  tasks:

    # ---------------------------------------------------------------- base

    - name: Base packages
      become: true
      ansible.builtin.apt:
        name: [git, curl, rsync, ca-certificates]
        update_cache: true
        cache_valid_time: 3600
      tags: [base]

    - name: Is docker already here
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: false
      tags: [base]

    # `pipefail` is not decoration: without it a failed download leaves
    # `sh` reading empty input, exiting zero, and Ansible reporting a
    # successful install of nothing.
    - name: Install docker
      become: true
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
        executable: /bin/bash
      when: docker_version.rc != 0
      changed_when: true
      tags: [base]

    - name: Let the deploy user talk to docker
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      tags: [base]

    # Reconnect so the new group membership is in effect; without this
    # every later `docker` call needs sudo, which is worse.
    - name: Pick up the docker group
      ansible.builtin.meta: reset_connection
      tags: [base]

    # `command -v` is a shell builtin — `command:` cannot run it, and
    # `which` is not installed on a minimal Ubuntu image.
    - name: Where docker actually is
      ansible.builtin.shell: command -v docker  # noqa: command-instead-of-shell
      register: docker_path
      changed_when: false
      tags: [base, config, repo]

    - name: Is uv already here
      ansible.builtin.stat:
        path: "{{ uv }}"
      register: uv_binary
      tags: [base]

    # uv, not apt: this project needs Python 3.14 and pins it, and Ubuntu
    # does not ship it. Bare `python`/`pip` are forbidden here anyway.
    - name: Install uv
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | sh
        executable: /bin/bash
      when: not uv_binary.stat.exists
      changed_when: true
      tags: [base]

    # Why an update at all: uv carries its own index of downloadable
    # interpreters, so a uv older than the pinned Python cannot fetch it.
    # `uv python install` then answers "No download found" and `uv sync`
    # "No interpreter found", neither of which points at uv's age.
    # Installing only when absent left a host carrying uv from some
    # earlier day quietly unable to build the environment.
    #
    # **Best effort, and deliberately unable to fail the run.** The
    # update is a means; the requirement is that the pinned interpreter
    # installs, and that is asserted after the clone where the message
    # can say so. This step reaches raw.githubusercontent.com, which is
    # not reachable from every network a collector runs on, and stopping
    # a deployment because an update server timed out would trade a real
    # problem for an imaginary one.
    #
    # Bounded by `timeout` because `uv self update` retries for about
    # ninety seconds before giving up — ninety seconds spent on every run
    # of a step that is allowed to fail.
    - name: Keep uv current
      ansible.builtin.command: "timeout 20 {{ uv }} self update"
      register: uv_update
      changed_when: uv_update.stdout is search('(?i)upgraded')
      failed_when: false
      when: uv_binary.stat.exists
      tags: [base]

    - name: Say so when uv could not be updated
      ansible.builtin.debug:
        msg: >-
          uv could not check for updates (rc={{ uv_update.rc }}). Harmless
          on its own. But if the pinned Python fails to install below, a
          uv older than that release is the likely reason — it carries its
          own index of what is downloadable.
      when:
        - uv_binary.stat.exists
        - uv_update.rc | default(0) != 0
      tags: [base]

    - name: Firewall allows ssh and nothing else
      become: true
      community.general.ufw:
        rule: allow
        name: OpenSSH
      tags: [base]

    - name: Firewall on
      become: true
      community.general.ufw:
        state: enabled
        policy: deny
      tags: [base]

    # A 4 GB host with no swap hands the OOM killer an easy choice during
    # a `derive` batch, and the fattest process is Postgres.
    - name: Swap file
      become: true
      ansible.builtin.command:
        cmd: fallocate -l {{ swap_size | default('2G') }} /swapfile
        creates: /swapfile
      tags: [base]

    - name: Swap permissions
      become: true
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
      tags: [base]

    - name: Format swap
      become: true
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -eo pipefail
          if ! swapon --show=NAME --noheadings | grep -qx /swapfile; then
            mkswap /swapfile
            swapon /swapfile
          fi
      register: swap_on
      changed_when: "'Setting up swapspace' in swap_on.stdout"
      tags: [base]

    - name: Swap survives reboot
      become: true
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present
      tags: [base]

    # A laptop's default is to suspend when the lid closes, and a
    # suspended collector does not merely pause — the snapshots it misses
    # are gone for good. History can be re-fetched; a reading of a post's
    # counters at age thirty minutes cannot be taken later, because the
    # post will not be thirty minutes old again. That is the whole reason
    # `watch` runs as its own phase, and a closed lid quietly undoes it.
    #
    # Off by default: on a rented machine there is no lid and masking
    # sleep would be noise in the unit list.
    - name: Sleep is masked on a laptop
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target
      when: host_is_laptop | default(false) | bool
      tags: [base, laptop]

    # Belt to the masking's braces, and it earns its place: masked
    # targets make a suspend *fail*, which logind logs as an error on
    # every lid close. This makes it not try.
    #
    # A drop-in rather than an edit to logind.conf, so a package upgrade
    # replacing that file does not silently take the setting with it.
    - name: Somewhere to put the logind drop-in
      become: true
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"
      when: host_is_laptop | default(false) | bool
      tags: [base, laptop]

    - name: The lid switch does nothing on a laptop
      become: true
      ansible.builtin.template:
        src: 10-itgraph-no-sleep.conf.j2
        dest: /etc/systemd/logind.conf.d/10-itgraph-no-sleep.conf
        mode: "0644"
        backup: true
      when: host_is_laptop | default(false) | bool
      notify: Reload logind
      tags: [base, laptop]

    # ---------------------------------------------------------------- repo

    - name: Clone the repository
      ansible.builtin.git:
        repo: "{{ itgraph_repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ itgraph_repo_version | default('master') }}"
        update: true
      register: repo_checkout
      tags: [repo]

    # The pinned interpreter, fetched explicitly rather than left to
    # `uv sync`, so a version uv cannot supply fails here — where the
    # message names Python — rather than inside a dependency install
    # that reports only "No interpreter found". Reads `.python-version`
    # from the checkout, so it has to follow the clone.
    - name: The pinned Python is available
      ansible.builtin.command: "{{ uv }} python install"
      args:
        chdir: "{{ repo_dir }}"
      register: python_install
      changed_when: "'Installed' in python_install.stderr"
      failed_when: false
      tags: [repo]

    - name: The pinned Python really installed
      ansible.builtin.assert:
        that: python_install.rc == 0
        fail_msg: >-
          Could not install the Python pinned in .python-version —
          {{ python_install.stderr | trim }}
          If that reads "No download found", the uv on this host is older
          than the pinned release and does not know it exists. Reinstall
          it by hand and re-run:
          curl -LsSf https://astral.sh/uv/install.sh | sh
        quiet: true
      tags: [repo]

    # Not `Resolved`: uv prints "Resolved N packages" on every run, an
    # unchanged environment included, so the task reported a change it had
    # not made on every run. `Installed` and `Uninstalled` appear only when
    # the environment actually changed.
    - name: Install dependencies
      ansible.builtin.command: "{{ uv }} sync"
      args:
        chdir: "{{ repo_dir }}"
      register: uv_sync
      changed_when: "'Installed' in uv_sync.stderr or 'Uninstalled' in uv_sync.stderr"
      tags: [repo]

    # No compose override here, deliberately. Binding Postgres to
    # loopback is done in the tracked `docker-compose.yaml`, because an
    # override cannot do it: Compose appends to a `ports` list rather
    # than replacing it, so the override published the port twice and
    # the container failed to start with "address already in use".
    #
    # A leftover `docker-compose.override.yml` from an earlier run would
    # still be picked up, so it is removed rather than merely not written.
    - name: No stale compose override
      ansible.builtin.file:
        path: "{{ repo_dir }}/docker-compose.override.yml"
        state: absent
      tags: [repo]

    - name: Configuration
      ansible.builtin.template:
        src: env.j2
        dest: "{{ repo_dir }}/.env"
        mode: "0600"
      register: env_file
      no_log: true
      tags: [repo, config]

    # ---------------------------------------------------------------- data

    - name: Start Postgres
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ repo_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
      tags: [data, migrate]

    - name: Wait for Postgres
      ansible.builtin.command: >-
        docker exec itgraph-postgres pg_isready -U {{ db_user }} -d {{ db_name }}
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false
      tags: [data, migrate]

    # Roles are cluster-level and `pg_dump` does not carry them, but the
    # GRANTs in the dump reference this one — so it has to exist before the
    # restore or those statements fail. NOLOGIN until a password is set.
    - name: Bot role exists before anything references it
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d postgres -tAc
        "DO $$ BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='itgraph_bot')
          THEN CREATE ROLE itgraph_bot NOLOGIN;
                RAISE NOTICE 'role_created';
          END IF;
        END $$;"
      register: bot_role
      changed_when: "'role_created' in bot_role.stderr"
      tags: [data]

    # Two statements where one would read more naturally, because one
    # cannot do it: SQL resolves a table name when it parses the
    # statement, so on a fresh database `SELECT count(*) FROM channels`
    # fails as a whole, a `CASE` guarding it included. The first question
    # tells a fresh database from the rest; only then is anything counted.
    #
    # Both fail on an error. An error read as an empty answer parses as
    # zero channels, and zero channels is the one answer that leads to a
    # restore — a probe that could not see the data must not be the
    # reason it gets replaced.
    - name: Is there a channels table
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT to_regclass('public.channels') IS NULL"
      register: channels_table
      changed_when: false
      failed_when: >-
        channels_table.rc != 0
        or channels_table.stdout | trim not in ['t', 'f']
      tags: [data, migrate]

    - name: How much is already in this database
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM channels"
      register: existing_channels
      changed_when: false
      when: channels_table.stdout | trim == 'f'
      tags: [data, migrate]

    # Rows are not the same thing as a database. An interrupted
    # `pg_restore --clean` drops the enum types, recreates them with new
    # OIDs and stops part way, leaving columns pointing at OIDs that no
    # longer exist. Postgres answers any query touching them with
    # "cache lookup failed for type NNNN", which surfaces as a SQLAlchemy
    # traceback in a service log days later and names nothing useful.
    #
    # This is the check that tells wreckage from data. It reads only the
    # catalog, so it answers on an empty database too — zero — and an
    # error here is an error, not a clean bill of health.
    - name: Is what is already here internally consistent
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM pg_attribute a
         JOIN pg_class c ON c.oid = a.attrelid AND c.relkind = 'r'
         JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'
         WHERE a.attnum > 0 AND NOT a.attisdropped
           AND NOT EXISTS (SELECT 1 FROM pg_type t WHERE t.oid = a.atttypid)"
      register: dangling_types
      changed_when: false
      tags: [data, migrate]

    # `restore_selected` exists for one combination: `force_restore` under
    # a tag selection that will not run the restore, such as
    # `--tags migrate`. Without it the flag would lift the stop below and
    # the migration would then run on the very database it was meant to
    # replace.
    - name: Decide whether to restore
      ansible.builtin.set_fact:
        channel_count: "{{ found | int }}"
        restore_needed: "{{ found | int == 0 or forced | bool }}"
        database_broken: "{{ found | int > 0 and dangling_types.stdout | trim | int > 0 }}"
        restore_selected: >-
          {{ ansible_run_tags | intersect(['all', 'tagged', 'data']) | length > 0
             and 'data' not in ansible_skip_tags }}
      vars:
        found: >-
          {{ 0 if channels_table.stdout | trim == 't'
             else existing_channels.stdout | trim | int }}
        forced: "{{ force_restore | default(false) | bool }}"
      tags: [data, migrate]

    # The restore comes from `itgraph_dump_src`, on the operator's
    # machine, and that dump is older than anything a collecting host has
    # gathered since. Restoring it over a database that holds channels
    # trades whatever is broken for everything collected after the dump —
    # metric snapshots included, which cannot be taken again. So a broken
    # database with channels in it stops the deploy rather than being
    # replaced: nothing is migrated on it and nothing is started on it.
    #
    # On a host that never collected — a first restore that stopped part
    # way — restoring again is the fix, and the flag costs nothing there.
    - name: A broken database stops the deploy
      ansible.builtin.assert:
        that: >-
          not database_broken | bool
          or (force_restore | default(false) | bool and restore_selected | bool)
        fail_msg: >-
          {{ dangling_types.stdout | trim }} column(s) reference a type that
          no longer exists, in a database holding {{ channel_count }}
          channels — the sign of a `pg_restore` that did not finish.
          Stopping before anything is restored, migrated or started. A
          restore here would come from {{ itgraph_dump_src }} on the
          operator's machine, which is older than whatever this host has
          collected since. On a host that has been collecting, restore from
          its own ~/itgraph-backups instead (src/itgraph/README.md,
          «Восстановление»). Only on a host that never collected, re-run
          with -e force_restore=true and the data tasks selected —
          `--tags migrate` alone never restores.
        quiet: true
      tags: [data, migrate]

    - name: Say so when the restore is skipped
      ansible.builtin.debug:
        msg: >-
          Restore skipped: {{ channel_count }} channels already here and the
          schema is coherent, so they are kept. Only -e force_restore=true
          would replace them, with {{ itgraph_dump_src }} from the
          operator's machine.
      when: not restore_needed | bool
      tags: [data]

    # The one destructive step in the playbook. A re-run must not be a way
    # to lose the hand-reviewed inventory, so it happens only into a
    # database with no channels in it, unless the operator says otherwise
    # on the command line. One block so the condition is stated once:
    # `when` on a block is applied to every task in it, and evaluated
    # before each — safe here because nothing inside changes
    # `restore_needed`.
    - name: Restore from the operator's dump
      when: restore_needed | bool
      tags: [data]
      block:
        # `copy_links` is load-bearing: `itgraph_dump_src` points at
        # `full-LATEST.dump`, which is a symlink, and `synchronize`
        # defaults to `archive: yes` — rsync `-a`, which includes `-l` and
        # copies a symlink *as a symlink*. The destination then dangles at
        # a filename that exists only on the operator's machine, and the
        # restore fails with a bare "No such file or directory" that says
        # nothing about why. `-L` sends what the link points at.
        - name: Ship the dump
          ansible.posix.synchronize:
            src: "{{ itgraph_dump_src }}"
            dest: /tmp/itgraph.dump
            copy_links: true

        # Checked before the restore rather than after: `pg_restore`
        # reading a missing or empty file reports it as a shell redirect
        # error, which names neither the dump nor the reason.
        - name: The dump arrived
          ansible.builtin.stat:
            path: /tmp/itgraph.dump
          register: shipped_dump

        - name: The dump is a real file with something in it
          ansible.builtin.assert:
            that:
              - shipped_dump.stat.exists
              - shipped_dump.stat.isreg
              - shipped_dump.stat.size > 0
            fail_msg: >-
              /tmp/itgraph.dump did not arrive as a readable file. Check that
              {{ itgraph_dump_src }} exists on this machine and that
              `make backup-full` has run since the last schema change.
            quiet: true

        - name: Restore
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: >-
              docker exec -i itgraph-postgres
              pg_restore -U {{ db_user }} -d {{ db_name }}
              --no-owner --clean --if-exists < /tmp/itgraph.dump
          register: restore_result
          changed_when: true

        # `pg_restore` exits zero on a partial restore more readily than
        # one would like, and the damage it leaves is invisible until
        # something queries an affected column. Asked here, where the
        # answer can still stop the deployment, rather than at 03:00 in a
        # service log.
        - name: The restored database is coherent
          ansible.builtin.command: >-
            docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
            "SELECT count(*) FROM pg_attribute a
             JOIN pg_class c ON c.oid = a.attrelid AND c.relkind = 'r'
             JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'
             WHERE a.attnum > 0 AND NOT a.attisdropped
               AND NOT EXISTS (SELECT 1 FROM pg_type t WHERE t.oid = a.atttypid)"
          register: dangling_after
          changed_when: false

        - name: Nothing points at a type that is gone
          ansible.builtin.assert:
            that: dangling_after.stdout | trim | int == 0
            fail_msg: >-
              The restore left {{ dangling_after.stdout | trim }} column(s)
              referencing a type that no longer exists, so it did not finish.
              Queries touching them fail with "cache lookup failed for type".
              Wipe and try again — `docker compose down -v && docker compose
              up -d` in {{ repo_dir }} — and check the dump restores on the
              machine that made it.
            quiet: true

    # Unconditional: also clears a dump left behind by an earlier run that
    # failed between shipping it and getting here.
    - name: Remove the dump from the host
      ansible.builtin.file:
        path: /tmp/itgraph.dump
        state: absent
      tags: [data]

    # The password goes in on stdin, not in the command line: `no_log`
    # hides it from Ansible's output but does nothing about /proc, where
    # an argument is readable by any local user for as long as psql runs.
    #
    # `''` is SQL's own escape for a quote inside a literal. Not the
    # `quote` filter — that is *shell* quoting, and it returns a bare
    # word for anything shell-safe, so an ordinary password would arrive
    # as `PASSWORD hunter2` and be a syntax error.
    #
    # ON_ERROR_STOP because `psql -f` exits 0 on a failed statement. Then
    # the role keeps its NOLOGIN password, the playbook says `changed`,
    # and the bot cannot connect for a reason nothing here reported.
    - name: Give the bot role its password
      ansible.builtin.command:
        cmd: >-
          docker exec -i itgraph-postgres
          psql -U {{ db_user }} -d {{ db_name }} -v ON_ERROR_STOP=1 -f -
        stdin: >-
          ALTER ROLE itgraph_bot LOGIN PASSWORD
          '{{ bot_db_password | replace("'", "''") }}'
      changed_when: true
      no_log: true
      tags: [data]

    # The dump carries the schema as of the moment it was taken, so a
    # dump older than a migration restores a database that is quietly
    # behind — and a host that has been collecting for weeks is behind
    # the moment code with a new migration is checked out. Either way the
    # failure would land on a timer, at night, on a machine nobody is
    # watching, so the schema reaches head here, before anything starts.
    #
    # Asked before it is done, because `alembic upgrade` is not free on a
    # working database: env.py takes a full dump first and then prunes
    # the weekly tier to four, whether or not anything is pending. An
    # upgrade on every run would let four re-runs in an evening push out
    # every dump older than the evening. `current` takes no dump — env.py
    # dumps on `upgrade` only.
    #
    # The matched text is alembic's own DatabaseNotAtHead. Anything else —
    # no .env, Postgres unreachable, a traceback — stops here with its own
    # output, rather than being read as "behind" and tried.
    - name: Is the schema at head
      ansible.builtin.command: "{{ uv }} run alembic current --check-heads"
      args:
        chdir: "{{ repo_dir }}"
      register: schema_check
      changed_when: false
      failed_when:
        - schema_check.rc != 0
        - "'Database is not on all head revisions' not in (schema_check.stdout ~ schema_check.stderr)"
      tags: [data, migrate]

    - name: Where the schema starts
      ansible.builtin.command: "{{ uv }} run alembic current"
      args:
        chdir: "{{ repo_dir }}"
      register: schema_before
      changed_when: false
      when: schema_check.rc != 0
      tags: [data, migrate]

    - name: Bring the schema to head
      ansible.builtin.command: "{{ uv }} run alembic upgrade head"
      args:
        chdir: "{{ repo_dir }}"
      register: schema_upgrade
      changed_when: true
      when: schema_check.rc != 0
      tags: [data, migrate]

    # env.py logs where it dumped to on stderr, through the `alembic`
    # logger that alembic.ini sends there. Kept for the report: it is the
    # file to reach for if this migration has to be undone. Empty when
    # the database had no tables, which env.py migrates without a dump.
    - name: Where the pre-migration dump went
      ansible.builtin.set_fact:
        migration_dump: >-
          {{ schema_upgrade.stderr | regex_search('backed up to [^ ]+')
             | default('', true) | regex_replace('^backed up to ', '') }}
      when: schema_check.rc != 0
      tags: [data, migrate]

    # Also tagged `services`, and that is what it is for. Tags select tasks
    # but never reorder them, so file order protects a full run only:
    # `--tags repo` followed by `--tags services` — the manual path minus
    # its migration — would otherwise enable the YouTube refresh on a
    # schema without its tables. Sitting here, ahead of session and
    # services, it runs first under `--tags services` and stops the run.
    - name: Schema is at head
      ansible.builtin.command: "{{ uv }} run alembic current --check-heads"
      args:
        chdir: "{{ repo_dir }}"
      register: alembic_current
      changed_when: false
      failed_when: false
      tags: [data, migrate, services]

    - name: Nothing starts on a schema that is behind
      ansible.builtin.assert:
        that: alembic_current.rc == 0
        fail_msg: >-
          The schema is not at the head of the code in {{ repo_dir }}, so
          no unit is installed, started or restarted. Bring it there first
          — the full playbook, or --tags migrate — then the services.
          alembic said: {{ (alembic_current.stdout ~ ' ' ~ alembic_current.stderr) | trim | truncate(400) }}
        quiet: true
      tags: [data, migrate, services]

    # Said here, after the gate has named the revision reached, and not
    # only in the final report: `--tags migrate` never gets to the report,
    # and a migration nobody was told about leaves nobody knowing which
    # dump to reach for.
    - name: Say what the migration did
      ansible.builtin.debug:
        msg: >-
          Migrated {{ schema_before.stdout_lines | default([]) | last | default('empty database') }}
          → {{ alembic_current.stdout_lines | default(['?']) | last }}.
          {{ ('Pre-migration dump at ' ~ migration_dump ~ '.')
             if migration_dump | default('') | length > 0
             else 'No dump taken: the database had no tables.' }}
      when: schema_upgrade is defined and schema_upgrade is not skipped
      tags: [data, migrate]

    # `score` without baselines does nothing and says so, so a missing
    # first run is visible rather than silent — but it would still mean
    # an evening of no virality alerts for no reason. Conditional,
    # because this is the one heavy pass here and re-running the playbook
    # must not drag it in every time.
    - name: Have baselines ever been computed
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM baseline_runs WHERE completed_at IS NOT NULL"
      register: baseline_runs
      changed_when: false
      tags: [data]

    - name: First baseline refresh
      ansible.builtin.command: "{{ uv }} run itgraph baselines"
      args:
        chdir: "{{ repo_dir }}"
      when: baseline_runs.stdout | trim | int == 0
      changed_when: true
      tags: [data]

    # ------------------------------------------------------------- session

    # Copied, never created. `itgraph login` on a new machine produces a
    # session with an empty entity cache, and every seed channel is then
    # skipped for want of a cached peer — days of stopped collection,
    # caused by a step that looks like ordinary setup.
    #
    # And copied only to a host that has none. Once collection runs on
    # the host, the session lives there and nowhere else — a second copy
    # on the operator's machine is a second full key to the account. But
    # `copy` with `force: false`, which leaves the host's file alone,
    # still insists on reading `src` on the controller first, so a re-run
    # on a live host failed here for want of a file it had no use for.
    # The host is asked first; the controller only when the host has
    # nothing.
    - name: Is there a session on the host
      ansible.builtin.stat:
        path: "{{ session_path }}"
        get_checksum: false
      register: host_session
      tags: [session]

    # Kept only if it can be a session. An empty file, or a directory left
    # by a bad copy, would be "kept" here and collection would stop on it
    # — found in a service log, not on this screen.
    - name: The session on the host is a real file with something in it
      ansible.builtin.assert:
        that:
          - host_session.stat.isreg
          - host_session.stat.size > 0
        fail_msg: >-
          {{ session_path }} exists but is not a regular file with
          something in it, and nothing here replaces it on its own. Move it
          aside on the host and re-run, so the session from
          {{ itgraph_session_src }} is copied — or put the right one back by
          hand.
        quiet: true
      when: host_session.stat.exists
      tags: [session]

    # `is file` is answered on the controller's filesystem, which is where
    # `src` has to be.
    - name: There is a session to copy
      ansible.builtin.assert:
        that: itgraph_session_src | expanduser is file
        fail_msg: >-
          No Telegram session on the host, and none at
          {{ itgraph_session_src }} on this machine. Copy the session from
          the machine that has been collecting to that path, or point
          itgraph_session_src at it, and re-run. Do not create one with
          `itgraph login`: a new session has an empty entity cache, and
          every seed channel would be skipped for want of a cached peer.
        quiet: true
      when: not host_session.stat.exists
      tags: [session]

    - name: Telegram session
      ansible.builtin.copy:
        src: "{{ itgraph_session_src }}"
        dest: "{{ session_path }}"
        mode: "0600"
        force: false
      when: not host_session.stat.exists
      tags: [session]

    # ------------------------------------------------------------ services

    - name: Unit files
      become: true
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        backup: true
      loop:
        - itgraph-watch.service
        - itgraph-bot.service
        - itgraph-alerts.service
        - itgraph-alerts.timer
        - itgraph-score.service
        - itgraph-score.timer
        - itgraph-baselines.service
        - itgraph-baselines.timer
        - itgraph-backup.service
        - itgraph-backup.timer
        - itgraph-yt-refresh.service
        - itgraph-yt-refresh.timer
        - itgraph-yt-watch.service
        - itgraph-yt-watch.timer
      register: unit_files
      notify: Reload systemd
      tags: [services]

    - name: Flush unit changes before starting anything
      ansible.builtin.meta: flush_handlers
      tags: [services]

    - name: Long-running services
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - itgraph-watch
        - itgraph-bot
      register: long_running
      tags: [services]

    # `started` above leaves a running unit alone, so without this a deploy
    # updates the code on disk and the collector keeps running the code
    # from before it. Restarted whenever this run fetched the code, and
    # otherwise when it changed `.env` or the unit's own file.
    #
    # Whenever the code was fetched, not only when the fetch changed
    # something. A run that pulls new code and then fails before this
    # point leaves the services on the old code, and the next run's
    # checkout reports nothing new — so "changed in this run" would lose
    # exactly the restart that run owes. The first re-run on the live host
    # did that. A few seconds of polling per full run is the price.
    #
    # A task and not a handler. Handlers ignore tags and run at the end of
    # the play, so under `--tags repo` a restart notified by the checkout
    # would land after the play — on a schema not yet migrated, the state
    # the gate in the data tasks exists to prevent. Not unconditional
    # either: `--tags services` is how a unit tweak is applied, and
    # bouncing `watch` for it costs a poll for nothing.
    #
    # Every registered result is read through `default` or `is defined`,
    # so a run that neither fetched code nor wrote anything — `--tags
    # services` alone — restarts nothing. A unit the task above just
    # started is skipped, or a fresh host would start the bot and bounce
    # it a second later. Timers need none of this: their services are
    # oneshots and start on the deployed code at their next firing.
    - name: Restart what is running old code
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop:
        - itgraph-watch
        - itgraph-bot
      when:
        - runs_old_code | bool
        - not just_started | bool
      vars:
        just_started: >-
          {{ long_running.results | default([])
             | selectattr('item', 'equalto', item)
             | selectattr('changed') | list | length > 0 }}
        runs_old_code: >-
          {{ repo_checkout is defined
             or env_file | default({}) is changed
             or unit_files.results | default([])
                | selectattr('item', 'equalto', item ~ '.service')
                | selectattr('changed') | list | length > 0 }}
      register: restarted_units
      tags: [services]

    # The backup timer is the one thing whose absence looks exactly like
    # everything working: `scripts/backup-agent.sh` is launchd, so on Linux
    # nothing takes a dump until this exists.
    - name: Timers
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - itgraph-alerts.timer
        - itgraph-score.timer
        - itgraph-baselines.timer
        - itgraph-backup.timer
      tags: [services]

    # Only where there is a key to refresh and poll with. Without one both
    # would fail every time, and a unit that always fails is one nobody
    # reads the failures of. Disabled again if the key is taken away, so
    # the timers always say whether YouTube data is being kept current
    # and new videos read.
    - name: YouTube timers
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: "{{ youtube_api_key | default('') | length > 0 }}"
        state: "{{ 'started' if youtube_api_key | default('') | length > 0 else 'stopped' }}"
      loop:
        - itgraph-yt-refresh.timer
        - itgraph-yt-watch.timer
      tags: [services]

    # -------------------------------------------------------------- verify

    # Checked rather than assumed, for the same reason the proxy route is:
    # a laptop that still suspends looks exactly like one that does not
    # until a night has passed and the snapshots are already lost.
    # `systemd:` has no query mode — it can only assert a state, which
    # would mask exactly the drift this check exists to catch.
    - name: Sleep really is masked
      ansible.builtin.command: systemctl is-enabled sleep.target  # noqa: command-instead-of-module
      register: sleep_state
      changed_when: false
      failed_when: false
      when: host_is_laptop | default(false) | bool
      tags: [verify]

    - name: A laptop cannot suspend
      ansible.builtin.assert:
        that: sleep_state.stdout | trim == "masked"
        fail_msg: >-
          sleep.target is "{{ sleep_state.stdout | trim }}", not masked. A
          closed lid will stop collection, and missed metric snapshots
          cannot be taken later.
        quiet: true
      when: host_is_laptop | default(false) | bool
      tags: [verify]

    - name: The inventory came across
      ansible.builtin.command: >-
        docker exec -i itgraph-postgres psql -U {{ db_user }} -d {{ db_name }} -tAc
        "SELECT count(*) FROM channels WHERE status='seed'"
      register: seed_count
      changed_when: false
      tags: [verify]

    - name: There are seed channels to collect
      ansible.builtin.assert:
        that: seed_count.stdout | trim | int > 0
        fail_msg: "No seed channels — the restore did not land."
        quiet: true
      tags: [verify]

    # Reads the line `build_client` logs at connect time. A deployment
    # whose `.env` did not arrive works, logs nothing unusual, and reaches
    # Telegram from the address the proxy exists to hide — this is the only
    # thing that catches it.
    #
    # From the running `watch`, which logs that line once per start. It
    # used to come from a one-request probe, which spent a real `backfill`
    # on every verify and was removed; the loop connects anyway, so its
    # own journal answers the same question for nothing.
    #
    # The current start only, by its InvocationID: a line from an earlier
    # start would answer for a `.env` that has changed since. Retried,
    # because a `watch` restarted a moment ago may not have connected yet.
    # As root, because whether the deploy user may read a system unit's
    # journal depends on group membership this playbook does not manage.
    - name: The route the running collector took
      become: true
      ansible.builtin.shell: >-
        journalctl --no-pager -o cat --grep 'Telegram route:'
        _SYSTEMD_INVOCATION_ID="$(systemctl show -p InvocationID --value itgraph-watch)"
      register: watch_route
      until: watch_route.rc == 0
      retries: 15
      delay: 2
      changed_when: false
      failed_when: false
      when: proxy_host is defined and proxy_host | length > 0
      tags: [verify]

    - name: The collector says which route it took
      ansible.builtin.assert:
        that: watch_route.rc == 0
        fail_msg: >-
          itgraph-watch has logged no "Telegram route:" line since it last
          started, so which way it reaches Telegram is unknown. It is likely
          not starting at all — refused the session lease, or failing
          before it connects. See `journalctl -u itgraph-watch -e` on the
          host.
        quiet: true
      when: proxy_host is defined and proxy_host | length > 0
      tags: [verify]

    - name: The proxy is actually in use
      ansible.builtin.assert:
        that: "'Telegram route: direct' not in watch_route.stdout"
        fail_msg: >-
          Connected directly. PROXY_* did not reach the process — check
          .env and the unit's WorkingDirectory.
        quiet: true
      when: proxy_host is defined and proxy_host | length > 0
      tags: [verify]

    - name: What the collector says about itself
      ansible.builtin.command: "{{ uv }} run itgraph watch-status"
      args:
        chdir: "{{ repo_dir }}"
      register: watch_status
      changed_when: false
      tags: [verify]

    # What this run did, beside what the host says about itself. Every
    # field reads its source through `default`: a part that was not
    # selected in this run registered nothing, and "not run" is the honest
    # answer for it — a skipped restore reported as done is exactly the
    # mistake a re-run that skips instead of stopping makes easy.
    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ seed_count.stdout | trim }} seed channels ·
          restore: {{ restore_report }} ·
          migration: {{ migration_report }} ·
          {{ alembic_current.stdout_lines | default(['schema not checked']) | last }} ·
          restarted: {{ restart_report }} ·
          {{ watch_status.stdout_lines | join(' · ') }}
      vars:
        restore_report: >-
          {{ 'restored'
               if restore_result is defined and restore_result is not skipped
             else 'skipped (' ~ channel_count ~ ' channels kept)'
               if restore_needed is defined and not restore_needed | bool
                  and restore_selected | bool
             else 'not run' }}
        migration_report: >-
          {{ (schema_before.stdout_lines | default([]) | last | default('empty database'))
               ~ ' → ' ~ (alembic_current.stdout_lines | default(['?']) | last)
               ~ (', dump at ' ~ migration_dump
                  if migration_dump | default('') | length > 0
                  else ', no dump taken')
               if schema_upgrade is defined and schema_upgrade is not skipped
             else 'none needed' if schema_check is defined
             else 'not run' }}
        restart_report: >-
          {{ (restarted_units.results | selectattr('changed')
               | map(attribute='item') | join(', ')) or 'none'
               if restarted_units is defined
             else 'not run' }}
      tags: [verify]

  handlers:
    # Handler names are matched literally and case-sensitively, and a
    # notify with no matching handler is a hard error rather than a
    # warning — so these have to read exactly as the `notify:` lines do.
    - name: Reload systemd
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reload logind
      become: true
      ansible.builtin.systemd_service:
        name: systemd-logind
        state: restarted
