repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # The vault is committed encrypted, so a plaintext one is a leak
      # that history keeps — and gitleaks passes the api hash and the
      # proxy host in it.
      - id: vault-encrypted
        name: vault files are encrypted
        entry: scripts/assert-vault-encrypted.sh
        language: script
        files: ^deploy/group_vars/.*vault\.yml$

      # The password is what the public ciphertext rests on. It is
      # git-ignored, and this catches the `git add -f`.
      - id: no-vault-password
        name: vault password is never committed
        entry: never commit the vault password
        language: fail
        files: (^|/)\.vault_pass$

      - id: lint
        name: ruff
        entry: make lint
        language: system
        pass_filenames: false
        types: [python]
        exclude: '(^|/)migrations/'

      - id: ansible-lint
        name: ansible-lint
        entry: make ansible-lint
        language: system
        pass_filenames: false
        # `files`, not `types: [python]` — the playbook and the templates
        # are the files this lints, and a hook keyed on Python never fires
        # for a commit that only touches deploy/.
        files: ^deploy/

      - id: typecheck
        name: mypy
        entry: make typecheck
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
        exclude: '(^|/)migrations/'

      - id: test
        name: pytest
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-push]
        exclude: '(^|/)migrations/'
