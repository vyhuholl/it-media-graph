[project]
name = "it-media-graph"
version = "0.1.0"
description = "IT media graph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "telethon>=1.44.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[project.scripts]
itgraph = "itgraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itgraph"]

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# Alembic revisions are applied by `alembic upgrade`, not by the test
# suite; counting them would only move the coverage number around.
omit = ["src/itgraph/db/migrations/*"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

# Telethon ships no py.typed marker and no stubs exist. Scoped to that one
# package — do not widen this to silence errors in our own code.
[[tool.mypy.overrides]]
module = ["telethon.*"]
ignore_missing_imports = true
