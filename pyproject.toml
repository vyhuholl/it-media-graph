[project]
name = "it-media-graph"
version = "0.1.0"
description = "IT media graph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.14.2",
    "python-socks>=2.8.2",
    "qrcode>=8.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "telethon>=1.44.0",
    "typer>=0.27.0",
]

[dependency-groups]
data = [
    "en-core-web-sm",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "ru-core-news-sm",
    "spacy>=3.8.13",
]
dev = [
    "ansible-lint>=26.6.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[project.scripts]
itgraph = "itgraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itgraph"]

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# Alembic revisions are applied by `alembic upgrade`, not by the test
# suite; counting them would only move the coverage number around.
omit = ["src/itgraph/db/migrations/*"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

# Neither Telethon nor qrcode ships a py.typed marker, and no stubs exist.
# Scoped to those two packages — do not widen this to silence errors in our
# own code.
[[tool.mypy.overrides]]
module = ["qrcode.*", "telethon.*"]
ignore_missing_imports = true

[tool.uv.sources]
ru-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0.tar.gz" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }
