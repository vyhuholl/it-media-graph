[project]
name = "it-media-graph"
version = "0.1.0"
description = "IT media graph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.14.2",
    "telethon>=1.44.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
