# A version tag publishes a release: the role as an archive with its sum, and the
# image image.yml built for the tagged commit under the version's tag, by digest.
# It builds nothing and deploys nothing: the repository that owns the host pins a
# release, and an operator runs the role at the pin.
#
# The one place CI gates anything, because a tag means something: what it publishes
# is what an operator will run. A push to master still only builds the image.

name: release

on:
  push:
    tags: ['v*']

# A release in progress is never cancelled: half of one is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itgraph
          POSTGRES_PASSWORD: itgraph
          POSTGRES_DB: itgraph
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U itgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked environment
        run: uv sync --locked
      # Includes the role's checks and the release's harness, which need no cluster.
      - name: The tests
        run: make test
        env:
          # Under GitHub Actions Typer takes the output for a terminal and draws
          # its errors in colour and in a box, which splits the text the CLI's
          # tests look for.
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Lint the role
        run: make ansible-lint

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # For this job alone: the release, and the image's new tag.
      contents: write
      packages: write
    steps:
      # The whole history: the release refuses a commit not on master.
      - name: Check out the tag, with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/release.sh "$GITHUB_REF_NAME"
